name: Install official Zabielos favicon
on:
  push:
    paths: ['.github/workflows/favicon.yml']
permissions:
  contents: write
jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image library
        run: python3 -m pip install --user Pillow
      - name: Create favicon from official Zabielos wordmark and link on every page
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import re,io
          source=Image.open('assets/zabielos-logo-official.png').convert('RGBA')
          print('Original logo dimensions',source.size)
          # Crop the official first letter Z, preserving its proportions
          w,h=source.size
          box=(int(w*.035),int(h*.10),int(w*.128),int(h*.92))
          letter=source.crop(box)
          # Remove pure white background for a clean icon
          pix=letter.load()
          for y in range(letter.height):
              for x in range(letter.width):
                  r,g,b,a=pix[x,y]
                  if min(r,g,b)>246:
                      pix[x,y]=(r,g,b,0)
          bounds=letter.getbbox()
          if bounds: letter=letter.crop(bounds)
          icon=Image.new('RGBA',(512,512),'#ffffff')
          letter.thumbnail((380,390),Image.Resampling.LANCZOS)
          icon.alpha_composite(letter,((512-letter.width)//2,(512-letter.height)//2))
          icon.save('favicon.png',optimize=True)
          icon.resize((180,180),Image.Resampling.LANCZOS).save('apple-touch-icon.png',optimize=True)
          icon.save('favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64)])
          changed=0
          for file in Path('.').rglob('index.html'):
              if '.git' in file.parts:continue
              html=file.read_text(encoding='utf-8')
              rel='../'*len(file.parent.parts)
              tags=f'<link rel="icon" type="image/png" sizes="512x512" href="{rel}favicon.png"><link rel="shortcut icon" href="{rel}favicon.ico"><link rel="apple-touch-icon" href="{rel}apple-touch-icon.png">'
              if 'rel="icon"' not in html:
                  html=html.replace('</head>',tags+'</head>',1)
                  file.write_text(html,encoding='utf-8')
                  changed+=1
          print('Favicon installed on',changed,'HTML pages')
          PY
      - name: Commit favicon and page references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.png favicon.ico apple-touch-icon.png '**/index.html' index.html
          if ! git diff --cached --quiet; then
            git commit -m "Apply official Zabielos logo favicon across multilingual pages"
            git push
          fi
