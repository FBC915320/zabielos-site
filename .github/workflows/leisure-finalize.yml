name: Finalize leisure sector navigation and SEO
on:
  push:
    paths: ['.github/workflows/leisure-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user Pillow
      - name: Repair metadata, language menus and source image crops
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, re
          prefix='https://fbc915320.github.io/zabielos-site/'
          locales={
           'pt':('Lazer e piscinas','Capas de proteção, capas térmicas e de segurança para piscinas, gazebos e acessórios de lazer para distribuidores B2B.','Sombreamento e proteção'),
           'en':('Leisure and pools','Swimming pool protection, thermal and safety covers, gazebos and outdoor accessories for B2B buyers.','Shading and protection'),
           'es':('Ocio y piscinas','Cubiertas de protección, térmicas y de seguridad para piscinas, gazebos y accesorios de ocio para distribuidores B2B.','Sombreo y protección'),
           'it':('Tempo libero e piscine','Coperture protettive, termiche e di sicurezza per piscine, gazebo e accessori per clienti B2B.','Ombreggiamento e protezione')
          }
          def esc(s):return s.replace('&','&amp;').replace('"','&quot;')
          for lang,(title,desc,shade) in locales.items():
            for p in Path(lang).rglob('index.html'):
              html=p.read_text()
              # Correct category label in all dropdowns, leaving existing links untouched.
              target='commerce/leisure-pools/'
              pat=r'(<a href="[^"]*'+re.escape(target)+r'">).*?(</a>)'
              html,n=re.subn(pat,lambda m:m.group(1)+title+m.group(2),html,count=1,flags=re.S)
              if n!=1:raise RuntimeError('Missing leisure menu in '+str(p))
              p.write_text(html)
            p=Path(lang)/'commerce/leisure-pools/index.html'
            html=p.read_text()
            seo_title=title+' | ZABIELOS'
            img=prefix+'assets/leisure/pool-safety-clean.webp'
            # Align social preview and schema with the newly created sector.
            for key,val in [('og:title',seo_title),('og:description',desc),('og:image',img),('twitter:title',seo_title),('twitter:description',desc),('twitter:image',img)]:
              if key.startswith('og:'):
                pattern=r'(<meta property="'+re.escape(key)+r'" content=")[^"]*'
              else:
                pattern=r'(<meta name="'+re.escape(key)+r'" content=")[^"]*'
              html,n=re.subn(pattern,lambda m:m.group(1)+esc(val),html,count=1)
              assert n==1,(p,key)
            pat=r'<script type="application/ld\+json">.*?</script>'
            schema={'@context':'https://schema.org','@type':'CollectionPage','name':seo_title,'description':desc,'url':prefix+lang+'/commerce/leisure-pools/','inLanguage':{'pt':'pt-BR','en':'en','es':'es','it':'it'}[lang],'isPartOf':{'@type':'WebSite','name':'ZABIELOS','url':prefix}}
            html,n=re.subn(pat,lambda m:'<script type="application/ld+json">'+json.dumps(schema,ensure_ascii=False,separators=(',',':'))+'</script>',html,count=1,flags=re.S)
            assert n==1,p
            p.write_text(html)
            shade_page=Path(lang)/'commerce/leisure-protection/index.html'
            h=shade_page.read_text()
            h=re.sub(r'(<meta property="og:title" content=")[^"]*',lambda m:m.group(1)+esc(shade+' | ZABIELOS'),h,count=1)
            h=re.sub(r'(<meta name="twitter:title" content=")[^"]*',lambda m:m.group(1)+esc(shade+' | ZABIELOS'),h,count=1)
            h=re.sub(r'<script type="application/ld\+json">.*?</script>',lambda m:m.group().replace('Lazer e proteção',shade).replace('Leisure and protection',shade).replace('Ocio y protección',shade).replace('Tempo libero e protezione',shade),h,count=1,flags=re.S)
            shade_page.write_text(h)
          # Improve visual crops; do not use generated images or create synthetic marks.
          crops={
            'pool-cover-clean':('pool-protection',(815,430,1190,840)),
            'gazebo-clean':('gazebo',(0,0,305,475))
          }
          for name,(src,box) in crops.items():
            with Image.open('assets/leisure/'+src+'.webp') as image:
              im=image.convert('RGB').crop(box)
              assert min(im.size)>=300
              im.save('assets/leisure/'+name+'.webp','WEBP',quality=87,method=6)
          # Remove source photographs with labels or packaging graphics: only clean crops remain public.
          for name in ('pool-protection','pool-safety','pool-thermal','gazebo'):
            Path('assets/leisure/'+name+'.webp').unlink(missing_ok=True)
          print('Reconciled four languages, SEO and clean original photos')
          PY
      - name: Verify new category and no obsolete navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for lang in ('pt','en','es','it'):
            new=Path(lang)/'commerce/leisure-pools/index.html'
            h=new.read_text()
            assert h.count('class="zb-product-photo-card"')==4,new
            assert 'Construção civil | ZABIELOS' not in h
            assert 'construction/' not in h
            assert 'CIKALA' not in h
            for p in Path(lang).rglob('index.html'):
              s=p.read_text()
              assert 'commerce/leisure-pools/' in s,p
              assert '/commerce/construction/' not in s or p==Path(lang)/'commerce/construction/index.html',p
          for name in ('pool-cover-clean','pool-safety-clean','pool-thermal-clean','gazebo-clean'):
            assert Path('assets/leisure/'+name+'.webp').exists()
          assert 'commerce/construction/' not in Path('sitemap.xml').read_text()
          print('Four-language menu, SEO, photo and sitemap checks passed')
          PY
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pt en es it assets/leisure
          git commit -m "Correct leisure menus SEO and remove original images showing supplier graphics"
          git push
