name: Correct plastic packaging image
on:
  push:
    paths: ['.github/workflows/fix-packaging-image.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pillow
      - name: Retrieve real photograph of plastic food containers
        run: |
          python3 - <<'PY'
          import urllib.request,re,html,io
          from PIL import Image
          page='https://unsplash.com/photos/a-group-of-clear-containers-with-food-in-them-2X0cM8ugyIQ'
          req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          tags=re.findall(r'<meta[^>]*>',raw,re.I)
          urls=[]
          for tag in tags:
            if 'og:image' in tag or 'twitter:image' in tag:
              m=re.search(r'content="([^"]+)"',tag)
              if m:urls.append(html.unescape(m.group(1)))
          for url in urls:
            if not url.startswith('https://images.unsplash.com/'):continue
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            im=Image.open(io.BytesIO(urllib.request.urlopen(req,timeout=30).read())).convert('RGB')
            if min(im.size)<350:continue
            im.thumbnail((1000,700),Image.Resampling.LANCZOS)
            im.save('assets/products/plastic-packaging.webp','WEBP',quality=85,method=6)
            print('SELECTED',url,im.size)
            break
          else:raise RuntimeError('No suitable packaging photo found')
          PY
      - name: Replace incorrect photo in all languages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          count=0
          for lang in ('pt','en','es','it'):
            for p in [Path(lang)/'index.html',Path(lang)/'commerce'/'index.html']:
              s=p.read_text()
              old=s
              # Only replace image in the second sector card.
              cards=list(re.finditer(r'<a class="zb-premium-card"[^>]*>.*?</a>',s,re.S))
              if len(cards)>=2:
                m=cards[1]
                card=m.group()
                prefix='../' if p.parent==Path(lang) else '../../'
                card=re.sub(r'<img src="[^"]+"',f'<img src="{prefix}assets/products/plastic-packaging.webp"',card,count=1)
                s=s[:m.start()]+card+s[m.end():]
              if s!=old:p.write_text(s);count+=1
          print('Updated',count,'pages')
          PY
      - name: Commit corrected photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products/plastic-packaging.webp pt en es it
          git commit -m "Replace hammer photo with real plastic food packaging photograph"
          git push
