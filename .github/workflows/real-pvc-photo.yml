name: Replace incorrect PVC illustration with real CK600 photo
on:
  push:
    paths: ['.github/workflows/real-pvc-photo.yml']
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user Pillow
      - name: Fetch official CK600 PVC photo
        run: |
          python3 - <<'PY'
          import urllib.request,re,html,io
          from PIL import Image
          page='https://www.cikala.com.br/lona-de-caminh-o-cinza-x-preta-emborrachada-ck600-micras-a-soluc-o-perfeita-para-protec-o-e-transporte-seguro'
          request=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'})
          content=urllib.request.urlopen(request,timeout=35).read().decode('utf-8','ignore')
          tags=re.findall(r'<meta\\s+[^>]*>',content,re.I)
          urls=[]
          for tag in tags:
            if 'itemprop="image"' in tag or 'og:image' in tag:
              m=re.search(r'content=["\\']([^"\\']+)["\\']',tag)
              if m:urls.append(html.unescape(m.group(1)))
          print('Image URLs',urls)
          for url in urls[::-1]:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              im=Image.open(io.BytesIO(urllib.request.urlopen(req,timeout=35).read())).convert('RGB')
              if min(im.size)<350:continue
              im.thumbnail((1400,1200),Image.Resampling.LANCZOS)
              im.save('assets/products/pvc-cover.webp','WEBP',quality=85,method=6)
              print('SELECTED',url,im.size)
              break
            except Exception as e:print('FAILED',str(e))
          else:raise RuntimeError('No valid CK600 photo')
          PY
      - name: Replace references in multilingual site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          count=0
          for p in Path('.').rglob('index.html'):
            s=p.read_text(encoding='utf-8')
            if 'assets/products/pvc-cover.svg' in s:
              p.write_text(s.replace('assets/products/pvc-cover.svg','assets/products/pvc-cover.webp'),encoding='utf-8')
              count+=1
          print('Updated pages',count)
          PY
      - name: Commit corrected photography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products/pvc-cover.webp '**/index.html'
          git commit -m "Replace unrelated PVC illustration with real CIKALA CK600 PVC product photo"
          git push
