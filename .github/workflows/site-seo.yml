name: Configure multilingual SEO and search indexing
on:
  push:
    paths:
      - '.github/workflows/site-seo.yml'
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build technical and content SEO for all existing pages
        run: |
          cat > /tmp/seo.py <<'PY'
          from pathlib import Path
          import re,html,json,xml.etree.ElementTree as ET
          BASE='https://fbc915320.github.io/zabielos-site/'
          langs={'pt':'pt-BR','en':'en','es':'es','it':'it'}
          locale={'pt':'pt_BR','en':'en_US','es':'es_ES','it':'it_IT'}
          company={'pt':'Representação comercial e negócios internacionais','en':'International commercial representation and business','es':'Representación comercial y negocios internacionales','it':'Rappresentanza commerciale e affari internazionali'}
          directory={
            'pt':{
              '':'Conectamos fabricantes, importadores e distribuidores. Representação comercial, sourcing, importação, exportação e pesquisa de mercado.',
              'services/':'Representação comercial, comércio exterior, localização de fabricantes, pesquisa de mercado e desenvolvimento de produtos private label.',
              'commerce/':'Explore setores B2B: snacks e biscoitos, embalagens plásticas, filmes, transporte, lonas, proteção e construção.',
              'about/':'Conheça a ZABIELOS, dedicada à conexão comercial entre fabricantes, distribuidores, importadores e compradores internacionais.',
              'contact/':'Contato comercial ZABIELOS para apresentar produtos, volumes, mercados e oportunidades de representação e sourcing.',
              'services/b2b-representation/':'Representação comercial B2B: aproximamos fabricantes de compradores, importadores e distribuidores em novos mercados.',
              'services/import-export/':'Apoio comercial à importação e exportação: pesquisa de fornecedores, propostas, negociações e coordenação com especialistas.',
              'services/manufacturer-sourcing/':'Sourcing internacional: pesquisa e comparação de fabricantes, catálogos, propostas, pedidos mínimos e prazos declarados.',
              'services/market-research/':'Pesquisa de mercado internacional: concorrentes, importadores, distribuidores, demanda e oportunidades comerciais verificáveis.',
              'services/product-development/':'Desenvolvimento de produtos e private label: busca de fabricantes, embalagens, personalização e marca própria.',
              'commerce/food-consumer/':'Biscoitos, cookies, wafers, crackers, batatas chips e salgadinhos para distribuição B2B e private label sob consulta.',
              'commerce/packaging/':'Embalagens plásticas para alimentos: copos, tampas, pratos, bandejas, potes e embalagens PET termoformadas.',
              'commerce/flexible-films/':'Filmes stretch e embalagens flexíveis: bobinas, sacos, filmes de proteção e aplicações logísticas B2B.',
              'commerce/transport-logistics/':'Lonas CK300, CK400 e CK600, telas de caminhão, cordas, cintas de amarração e lona encerada para transporte.',
              'commerce/leisure-protection/':'Telas de sombreamento, velas tensionadas, coberturas de piscina e proteção de áreas externas para negócios B2B.',
              'commerce/construction/':'Lonas para construção, telas e redes técnicas, coberturas provisórias e materiais para proteção de obras.'
            },
            'en':{
              '':'Connect manufacturers, importers and distributors through international representation, sourcing, trade and market research.',
              'services/':'Commercial representation, import-export, manufacturer sourcing, market research and private-label product development.',
              'commerce/':'Explore B2B sectors including packaged snacks, plastic packaging, flexible films, transport covers and construction.',
              'about/':'Learn about ZABIELOS and its international business development, sourcing and commercial representation focus.',
              'contact/':'Contact ZABIELOS about commercial representation, product sourcing, business quantities and international opportunities.',
              'services/b2b-representation/':'B2B representation: we connect manufacturers with importers, distributors and prospective buyers in international markets.',
              'services/import-export/':'Commercial import-export support: supplier research, quotations, negotiations and specialist coordination.',
              'services/manufacturer-sourcing/':'International manufacturer sourcing: identify potential factories, compare proposals, lead times and minimum orders.',
              'services/market-research/':'International market research: competitors, importers, distributors and verifiable business opportunities.',
              'services/product-development/':'Product development and private label sourcing for customized goods, packaging and contract manufacturing.',
              'commerce/food-consumer/':'Biscuits, cookies, crackers, potato chips, packaged snacks and private-label food product sourcing.',
              'commerce/packaging/':'Plastic food packaging including cups, lids, trays, plates and thermoformed PET food containers.',
              'commerce/flexible-films/':'Stretch films, flexible packaging, plastic rolls, bags and cargo protection materials for B2B buyers.',
              'commerce/transport-logistics/':'Truck tarpaulins, cargo containment nets, ropes, ratchet straps and protective freight covers.',
              'commerce/leisure-protection/':'Shade nets, tensioned shade sails, pool covers and outdoor protection for commercial buyers.',
              'commerce/construction/':'Construction tarpaulins, technical nets, temporary covers and industrial protective materials.'
            },
            'es':{
              '':'Conectamos fabricantes, importadores y distribuidores mediante representación, sourcing y comercio internacional.',
              'services/':'Representación comercial, importación, exportación, búsqueda de fabricantes, investigación y marca propia.',
              'commerce/':'Sectores B2B: snacks, galletas, envases plásticos, películas flexibles, transporte y construcción.',
              'about/':'Conozca ZABIELOS, dedicada al desarrollo de negocios, sourcing y representación comercial internacional.',
              'contact/':'Contacto comercial ZABIELOS para consultas de productos, volúmenes, proveedores y oportunidades internacionales.',
              'services/b2b-representation/':'Representación B2B para conectar fabricantes con importadores, distribuidores y compradores internacionales.',
              'services/import-export/':'Apoyo comercial a importación y exportación: búsqueda de proveedores, cotizaciones y negociaciones.',
              'services/manufacturer-sourcing/':'Búsqueda internacional de fabricantes: comparar catálogos, propuestas, plazos y pedidos mínimos.',
              'services/market-research/':'Investigación de mercados: competencia, importadores, distribuidores y oportunidades verificables.',
              'services/product-development/':'Desarrollo de productos y marca propia: búsqueda de fábricas, personalización y envases.',
              'commerce/food-consumer/':'Galletas, cookies, crackers, patatas chips, snacks envasados y proyectos de marca propia.',
              'commerce/packaging/':'Envases plásticos alimentarios: vasos, tapas, platos, bandejas y contenedores termoformados PET.',
              'commerce/flexible-films/':'Film stretch, bolsas, bobinas y envases flexibles para aplicaciones comerciales y logísticas.',
              'commerce/transport-logistics/':'Lonas para camiones, mallas de contención, cuerdas, cintas de amarre y cubiertas de cargas.',
              'commerce/leisure-protection/':'Mallas de sombreo, velas tensadas, cubiertas de piscina y protección exterior.',
              'commerce/construction/':'Lonas para obras, redes técnicas, cubiertas temporales y protección industrial.'
            },
            'it':{
              '':'Colleghiamo produttori, importatori e distributori con rappresentanza commerciale, sourcing e affari internazionali.',
              'services/':'Rappresentanza commerciale, import-export, ricerca produttori, analisi di mercato e private label.',
              'commerce/':'Settori B2B: snack, biscotti, imballaggi plastici, film flessibili, trasporti ed edilizia.',
              'about/':'Scopri ZABIELOS, dedicata allo sviluppo commerciale, sourcing e rappresentanza internazionale.',
              'contact/':'Contatta ZABIELOS per prodotti, quantità, ricerca fornitori e opportunità commerciali internazionali.',
              'services/b2b-representation/':'Rappresentanza B2B: mettiamo in contatto produttori con importatori, distributori e acquirenti.',
              'services/import-export/':'Supporto commerciale a import ed export: ricerca fornitori, preventivi e trattative internazionali.',
              'services/manufacturer-sourcing/':'Ricerca produttori internazionali: confronto di cataloghi, offerte, tempi e minimi di ordine.',
              'services/market-research/':'Ricerca di mercato: concorrenti, importatori, distributori e opportunità commerciali verificabili.',
              'services/product-development/':'Sviluppo prodotti e private label: produttori, personalizzazione, packaging e marchio proprio.',
              'commerce/food-consumer/':'Biscotti, cookies, cracker, patatine, snack confezionati e prodotti private label.',
              'commerce/packaging/':'Imballaggi plastici alimentari: bicchieri, coperchi, piatti, vassoi e contenitori PET.',
              'commerce/flexible-films/':'Film estensibili, bobine, sacchetti e imballaggi flessibili per usi commerciali.',
              'commerce/transport-logistics/':'Teloni per camion, reti fermacarico, corde, cinghie a cricchetto e protezioni per trasporto.',
              'commerce/leisure-protection/':'Reti ombreggianti, vele tensionate, coperture per piscine e protezioni da esterno.',
              'commerce/construction/':'Teloni per cantieri, reti tecniche, coperture temporanee e materiali per protezione industriale.'
            }
          }
          files={l:sorted(Path(l).rglob('index.html')) for l in langs}
          all_rel={l:{('' if str(p.relative_to(Path(l)).parent)=='.' else p.relative_to(Path(l)).parent.as_posix()):p for p in ps} for l,ps in files.items()}
          def segment(p,l):
            rel=p.relative_to(Path(l)).parent
            return '' if str(rel)=='.' else rel.as_posix().strip('/')+'/'
          def plaintext(value):
            return html.unescape(re.sub(r'<[^>]*>','',value)).strip()
          def page_title(doc,l,relative):
            h1=re.search(r'<h1[^>]*>(.*?)</h1>',doc,re.I|re.S)
            t=plaintext(h1.group(1)) if h1 else ''
            if not t:
              t=company[l]
            # Prevent duplicate business names and keep descriptive titles.
            return (t+' | ZABIELOS')[:95]
          def desc_for(doc,l,relative):
            description=directory[l].get(relative)
            if not description:
              hero=re.search(r'<section[^>]*class="[^"]*(?:subhero|zb-premium-hero)[^"]*"[^>]*>.*?<p[^>]*>(.*?)</p>',doc,re.I|re.S)
              if hero:description=plaintext(hero.group(1))
              if not description:
                meta=re.search(r'<meta\s+name="description"\s+content="([^"]*)"',doc,re.I)
                if meta:description=html.unescape(meta.group(1))
            return (description or company[l]).strip()[:210]
          def ogimage(rel):
            if rel=='commerce/transport-logistics/':
              return BASE+'assets/logistics/pvc-ck400.webp'
            if rel=='commerce/food-consumer/':
              return BASE+'assets/products/snacks-private-label.webp'
            if rel in ('commerce/packaging/','commerce/flexible-films/'):
              return BASE+'assets/products/plastic-packaging.webp'
            return BASE+'assets/zabielos-logo-official.png'
          def schema_type(rel):
            if rel.startswith('services/') and rel!='services/':return 'Service'
            if rel.startswith('commerce/') or rel in ('commerce/','services/'):return 'CollectionPage'
            if rel=='about/':return 'AboutPage'
            if rel=='contact/':return 'ContactPage'
            return 'WebPage'
          count=0
          for lang,paths in files.items():
            for p in paths:
              rel=segment(p,lang)
              raw=p.read_text(encoding='utf-8')
              canonical=BASE+lang+'/'+rel
              title=page_title(raw,lang,rel)
              description=desc_for(raw,lang,rel)
              # Replace all conflicting SEO annotations from prior edits.
              raw=re.sub(r'<title>.*?</title>','',raw,flags=re.I|re.S)
              raw=re.sub(r'<meta\s+name=["\'](?:description|robots|twitter:[^"\']+)["\'][^>]*>','',raw,flags=re.I)
              raw=re.sub(r'<meta\s+property=["\'](?:og:[^"\']+|article:[^"\']+)["\'][^>]*>','',raw,flags=re.I)
              raw=re.sub(r'<link\s+rel=["\'](?:canonical|alternate)["\'][^>]*>','',raw,flags=re.I)
              raw=re.sub(r'<script\s+type="application/ld\+json"[^>]*>.*?</script>','',raw,flags=re.I|re.S)
              if rel.startswith('services/') and rel!='services/':
                schema={'@context':'https://schema.org','@type':'Service','name':plaintext(re.search(r'<h1[^>]*>(.*?)</h1>',raw,re.S|re.I).group(1)),'description':description,'provider':{'@type':'Organization','name':'ZABIELOS','url':BASE},'url':canonical}
              else:
                schema={'@context':'https://schema.org','@type':schema_type(rel),'name':title,'description':description,'url':canonical,'inLanguage':langs[lang],'isPartOf':{'@type':'WebSite','name':'ZABIELOS','url':BASE}}
              if rel=='':
                schema={'@context':'https://schema.org','@graph':[schema,{'@type':'Organization','name':'ZABIELOS','url':BASE,'logo':BASE+'assets/zabielos-logo-official.png','description':company[lang]},{'@type':'WebSite','name':'ZABIELOS','url':BASE,'inLanguage':list(langs.values())}]}
              esc=lambda v:html.escape(v,quote=True)
              alternates=''.join('<link rel="alternate" hreflang="'+langs[other]+'" href="'+esc(BASE+other+'/'+rel)+'">' for other in langs if rel.rstrip('/') in all_rel[other])
              xdefault='<link rel="alternate" hreflang="x-default" href="'+BASE+'en/'+rel+'">' if rel.rstrip('/') in all_rel['en'] else ''
              metadata=(
                '<title>'+esc(title)+'</title>'
                +'<meta name="description" content="'+esc(description)+'">'
                +'<meta name="robots" content="index,follow,max-image-preview:large">'
                +'<link rel="canonical" href="'+esc(canonical)+'">'
                +alternates+xdefault
                +'<meta property="og:site_name" content="ZABIELOS">'
                +'<meta property="og:type" content="website">'
                +'<meta property="og:title" content="'+esc(title)+'">'
                +'<meta property="og:description" content="'+esc(description)+'">'
                +'<meta property="og:url" content="'+esc(canonical)+'">'
                +'<meta property="og:locale" content="'+locale[lang]+'">'
                +'<meta property="og:image" content="'+esc(ogimage(rel))+'">'
                +'<meta property="og:image:alt" content="ZABIELOS — '+esc(company[lang])+'">'
                +'<meta name="twitter:card" content="summary_large_image">'
                +'<meta name="twitter:title" content="'+esc(title)+'">'
                +'<meta name="twitter:description" content="'+esc(description)+'">'
                +'<meta name="twitter:image" content="'+esc(ogimage(rel))+'">'
                +'<script type="application/ld+json">'+json.dumps(schema,ensure_ascii=False,separators=(',',':')).replace('</','<\\/')+'</script>'
              )
              assert '</head>' in raw,p
              raw=raw.replace('</head>',metadata+'</head>',1)
              p.write_text(raw,encoding='utf-8')
              count+=1
          # GitHub Pages project site canonical, not a domain with unconfirmed DNS.
          Path('robots.txt').write_text('User-agent: *\nAllow: /zabielos-site/\nSitemap: '+BASE+'sitemap.xml\n',encoding='utf-8')
          ET.register_namespace('', 'http://www.sitemaps.org/schemas/sitemap/0.9')
          ET.register_namespace('xhtml','http://www.w3.org/1999/xhtml')
          NS='http://www.sitemaps.org/schemas/sitemap/0.9'
          XNS='http://www.w3.org/1999/xhtml'
          root=ET.Element('{'+NS+'}urlset')
          for lang,paths in files.items():
            for p in paths:
              rel=segment(p,lang)
              node=ET.SubElement(root,'{'+NS+'}url')
              ET.SubElement(node,'{'+NS+'}loc').text=BASE+lang+'/'+rel
              for other in langs:
                if rel.rstrip('/') in all_rel[other]:
                  ET.SubElement(node,'{'+XNS+'}link',{'rel':'alternate','hreflang':langs[other],'href':BASE+other+'/'+rel})
              if rel.rstrip('/') in all_rel['en']:
                ET.SubElement(node,'{'+XNS+'}link',{'rel':'alternate','hreflang':'x-default','href':BASE+'en/'+rel})
          ET.ElementTree(root).write('sitemap.xml',encoding='utf-8',xml_declaration=True)
          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          if '<meta name="robots"' not in s:
            s=s.replace('<head>','<head><meta name="robots" content="noindex,follow">',1)
          if '<title>' not in s:
            s=s.replace('</head>','<title>ZABIELOS — International Business</title></head>',1)
          index.write_text(s,encoding='utf-8')
          print('SEO applied to',count,'language pages; sitemap rebuilt with',sum(map(len,files.values())),'real URLs')
          PY
          python3 /tmp/seo.py
      - name: Validate SEO metadata, indexes and markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,xml.etree.ElementTree as ET
          BASE='https://fbc915320.github.io/zabielos-site/'
          roots=['pt','en','es','it']
          checked=0
          for l in roots:
            for f in Path(l).rglob('index.html'):
              raw=f.read_text(encoding='utf-8')
              assert raw.count('<link rel="canonical"')==1,f
              assert raw.count('<meta name="description"')==1,f
              assert raw.count('<title>')==1,f
              assert raw.count('application/ld+json')==1,f
              assert 'https://zabielos.com/' not in raw,f
              assert 'og:title' in raw and 'twitter:card' in raw,f
              schema=re.search(r'<script type="application/ld\+json">(.*?)</script>',raw,re.S)
              json.loads(schema.group(1))
              assert 'hreflang="x-default"' in raw,f
              checked+=1
          root=ET.parse('sitemap.xml').getroot()
          count=len(root.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url'))
          assert count==checked,(count,checked)
          assert BASE+'sitemap.xml' in Path('robots.txt').read_text()
          assert 'noindex,follow' in Path('index.html').read_text()
          print('Validated',checked,'unique canonical pages and sitemap entries')
          PY
      - name: Publish SEO changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt en es it sitemap.xml robots.txt index.html
          git commit -m "Implement multilingual search SEO, structured data, canonical URLs and sitemap for Zabielos"
          git push
