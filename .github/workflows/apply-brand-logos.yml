name: Apply official logos to Zabielos brand pages
on:
  push:
    paths: ['.github/workflows/apply-brand-logos.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update brand pages in all languages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for lang in ('pt','en','es','it'):
            root=Path(lang)
            p=root/'brands'/'index.html'
            s=p.read_text()
            for brand,slug in [('cikala','cikala'),('shade','shade')]:
              pattern=r'(<article class="card product-card brand-card">(?:(?!</article>).)*?<div class="brand-card-copy">)'
              matches=list(re.finditer(pattern,s,re.S))
              idx=0 if brand=='cikala' else 1
              if len(matches)>idx:
                m=matches[idx]
                tag=f'<div class="official-brand-logo"><img src="../../assets/brands/{slug}.webp" alt="Logotipo oficial {brand.upper()}" loading="lazy"></div>'
                s=s[:m.end()]+tag+s[m.end():]
            if 'brand-product-line' in s:
              s=s.replace('<div class="brand-product-line">','<div class="brand-product-line"><div class="official-sail-logo"><img src="../../assets/brands/shade-sail.webp" alt="Logotipo oficial Shade Sail" loading="lazy"></div>',1)
            p.write_text(s)
            p=root/'index.html';s=p.read_text()
            for name in ('cikala','shade'):
              needle=f'<a href="brands/{name}/">'
              insert=f'<span class="brand-logo-overlay"><img src="../assets/brands/{name}.webp" alt="Logotipo oficial {name.upper()}" loading="lazy"></span>'
              s=s.replace(needle,needle+insert,1)
            s=s.replace('<p class="brand-line-link">','<div class="shade-sail-logo-home"><img src="../assets/brands/shade-sail.webp" alt="Logotipo oficial Shade Sail" loading="lazy"></div><p class="brand-line-link">',1)
            p.write_text(s)
            for name in ('cikala','shade','shade-sail'):
              p=root/'brands'/name/'index.html';s=p.read_text()
              marker='<section class="subhero"><div class="wrap">'
              insert=f'<div class="brand-detail-logo"><img src="../../../assets/brands/{name}.webp" alt="Logotipo oficial {name}" loading="lazy"></div>'
              s=s.replace(marker,marker+insert,1)
              p.write_text(s)
          css=Path('assets/site.css')
          css.write_text(css.read_text()+"""
          /* Official brand logos: never crop or stretch */
          .official-brand-logo{display:flex;align-items:center;justify-content:flex-start;background:#fff;border:1px solid #e5e9eb;border-radius:10px;padding:12px;margin-bottom:12px;min-height:90px}
          .official-brand-logo img{display:block;max-width:100%;width:auto;height:auto;max-height:76px;object-fit:contain}
          .official-sail-logo{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;padding:14px;margin-bottom:18px}
          .official-sail-logo img{width:auto;max-width:100%;height:auto;max-height:140px;object-fit:contain}
          .brand-logo-overlay{position:absolute;top:12px;left:12px;z-index:2;background:#fff;border-radius:9px;padding:9px;width:min(55%,190px);box-shadow:0 3px 12px #0a253326}
          .brand-logo-overlay img{position:static!important;display:block;width:100%;height:auto!important;max-height:76px;object-fit:contain!important;opacity:1!important;transform:none!important}
          .shade-sail-logo-home{display:inline-flex;background:#fff;border:1px solid #e5e9eb;border-radius:9px;padding:12px;margin-top:22px}
          .shade-sail-logo-home img{width:170px;height:auto;object-fit:contain}
          .brand-detail-logo{display:inline-flex;background:#fff;border-radius:10px;padding:14px;margin-bottom:20px}
          .brand-detail-logo img{max-width:min(300px,70vw);width:auto;height:auto;max-height:130px;object-fit:contain}
          @media(max-width:550px){.brand-logo-overlay{width:49%}.official-brand-logo img{max-height:66px}}
          """)
          PY
      - name: Commit official logo placements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt en es it assets/site.css
          git commit -m "Display official CIKALA SHADE and Shade Sail logos on company pages"
          git push
