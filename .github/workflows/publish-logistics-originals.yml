name: Publish genuine unbranded CIKALA transport photos
on:
  push:
    paths: ['.github/workflows/publish-logistics-originals.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pillow
      - name: Crop brand-free photographs and build complete transport portfolios
        run: |
          cat > /tmp/publish.py <<'PY'
          from pathlib import Path
          from PIL import Image
          import re,html,shutil
          src=Path('assets/logistics-source')
          dest=Path('assets/logistics')
          dest.mkdir(parents=True,exist_ok=True)
          originals={
            'pe-ck300':('lona-pe-ck300',None),
            'pvc-ck400':('lona-pvc-ck400',None),
            'pvc-ck600':('lona-pvc-ck600',(0,0,1000,420)),
            'algodao-encerado':('lona-algodao',None),
            'tela-preta':('tela-preta',(0,0,1080,720)),
            'tela-cinza':('tela-cinza',(0,0,500,340)),
            'cordas':('corda',None),
            'cintas':('cinta',None)
          }
          for name,(source,crop) in originals.items():
            p=src/(source+'.webp')
            assert p.exists(),p
            with Image.open(p) as im:
              im=im.convert('RGB')
              if crop:im=im.crop(crop)
              im.thumbnail((1200,1100),Image.Resampling.LANCZOS)
              assert min(im.size)>=300,(name,im.size)
              im.save(dest/(name+'.webp'),'WEBP',quality=88,method=6)
              print('Genuine CIKALA photo prepared:',name,im.size)
          data={
            'pt':{
              'title':'Transporte e logística','intro':'Lonas para caminhões, telas de proteção de cargas, cordas e cintas de amarração — portfólio B2B para transporte rodoviário e distribuição.',
              'groups':[
                ('Lonas para transporte',[
                  ('Lona CK300 — polietileno','Lona leve de PE para cobertura e proteção de cargas. Consulte medidas, cor e acabamento.','pe-ck300'),
                  ('Lona CK400 — PVC','Lona de PVC para coberturas rodoviárias, carretinhas e caminhonetes; especificações sob consulta.','pvc-ck400'),
                  ('Lonas PVC CK500 e CK600','Alternativas em PVC para transporte e proteção de cargas. A versão CK500 depende de confirmação técnica e comercial.','pvc-ck600'),
                  ('Lona encerada de algodão','Encerados de algodão, inclusive fio 08, para proteção de cargas; consulte acabamento e dimensões.','algodao-encerado')]),
                ('Telas para caminhão',[
                  ('Tela preta para transporte','Tela preta para contenção de materiais como recicláveis, grãos e sucata; consultar malha e medidas.','tela-preta'),
                  ('Tela cinza para transporte','Tela industrial cinza para proteção e contenção de cargas; verificar gramatura e aplicação.','tela-cinza')]),
                ('Fixação e amarração',[
                  ('Cordas de amarração','Cordas de poliéster e outras fibras, em diferentes diâmetros e apresentações.','cordas'),
                  ('Cintas e catracas','Cintas de amarração, modelos com catraca e gancho e acessórios de contenção.','cintas')])
              ],
              'applications':'Para quem é esta linha','audiences':['Transportadoras e operadores logísticos','Distribuidores de lonas, telas e acessórios','Cargas agrícolas, recicláveis e materiais industriais','Empresas de armazenagem e proteção de equipamentos'],
              'quote':'Solicite uma cotação técnica','quoteText':'Informe tipo de produto, material, medidas, espessura ou gramatura, cor, acabamentos, acessórios, quantidade e destino. Trabalhamos com especificações a confirmar antes de qualquer proposta.',
              'safety':'Cintas para amarração não devem ser apresentadas como cintas de elevação. Verifique os limites e as normas aplicáveis ao modelo.',
              'note':'Fotografias reais de produtos, reproduzidas do catálogo original. Não divulgamos o fornecedor nem presumimos disponibilidade ou representação contratual.',
              'cta':'Solicitar informações'},
            'en':{
              'title':'Transport and logistics','intro':'Truck tarpaulins, cargo containment nets, ropes and tie-down straps — a B2B range for transport and distribution.',
              'groups':[
                ('Transport tarpaulins',[
                  ('CK300 — polyethylene tarpaulin','Lightweight PE cover for freight protection. Dimensions, color and finishing on inquiry.','pe-ck300'),
                  ('CK400 — PVC tarpaulin','PVC truck cover for trailers and light commercial vehicles, specification on request.','pvc-ck400'),
                  ('CK500 and CK600 — PVC tarpaulins','PVC options for freight coverage; CK500 characteristics and availability require confirmation.','pvc-ck600'),
                  ('Waxed cotton canvas','Waxed cotton canvas for freight covers, including thread 08 grades.','algodao-encerado')]),
                ('Truck cargo nets',[
                  ('Black containment net','Black mesh for scrap, recycling and bulk cargo; mesh and dimensions on request.','tela-preta'),
                  ('Grey containment net','Grey industrial net for freight protection; weight and application to be confirmed.','tela-cinza')]),
                ('Cargo fastening',[
                  ('Ropes','Polyester and other rope types, with various diameters and formats.','cordas'),
                  ('Ratchet tie-down straps','Tie-down straps with ratchets and hooks, plus load restraint accessories.','cintas')])
              ],
              'applications':'Who this range serves','audiences':['Freight operators and logistics companies','Tarpaulin, net and accessory distributors','Agricultural, recycling and industrial loads','Warehousing and equipment protection businesses'],
              'quote':'Request a technical quotation','quoteText':'Provide product type, material, dimensions, thickness or fabric weight, color, fittings, quantity and destination. All specifications must be confirmed.',
              'safety':'Cargo tie-down straps are not automatically suitable for lifting. Verify product-specific limits and applicable rules.',
              'note':'Genuine original product photographs. Suppliers are not publicly identified and availability is not presumed.',
              'cta':'Request information'},
            'es':{
              'title':'Transporte y logística','intro':'Lonas para camiones, mallas de contención, cuerdas y cintas de amarre — línea B2B para transporte y distribución.',
              'groups':[
                ('Lonas para transporte',[
                  ('CK300 — polietileno','Lona ligera de PE para protección de cargas. Consultar medidas, color y acabado.','pe-ck300'),
                  ('CK400 — PVC','Lona PVC para camiones ligeros y remolques, especificaciones bajo consulta.','pvc-ck400'),
                  ('CK500 y CK600 — PVC','Opciones de PVC para cubrir cargas; características de CK500 sujetas a confirmación.','pvc-ck600'),
                  ('Lona encerada de algodón','Lonas enceradas de algodón, incluso hilo 08, para protección de cargas.','algodao-encerado')]),
                ('Mallas para camiones',[
                  ('Malla negra','Malla negra para chatarra, reciclables y granos; confirmar abertura y tamaño.','tela-preta'),
                  ('Malla gris','Malla industrial gris para contención de cargas; gramaje y aplicación sujetos a confirmación.','tela-cinza')]),
                ('Fijación y amarre',[
                  ('Cuerdas','Cuerdas de poliéster y otros materiales, diversos diámetros y presentaciones.','cordas'),
                  ('Cintas con carraca','Cintas de amarre con carracas y ganchos, más accesorios de fijación.','cintas')])
              ],
              'applications':'Clientes y aplicaciones','audiences':['Transportistas y operadores logísticos','Distribuidores de lonas, mallas y accesorios','Agroindustria, reciclaje y cargas industriales','Almacenamiento y protección de equipos'],
              'quote':'Solicitar cotización técnica','quoteText':'Indique material, medidas, espesor o gramaje, color, acabados, accesorios, cantidad y destino. Especificaciones por confirmar.',
              'safety':'Las cintas de amarre no son automáticamente aptas para elevación. Verifique los límites de cada modelo.',
              'note':'Fotografías originales de los productos. No se identifican públicamente los proveedores ni se presume disponibilidad.',
              'cta':'Solicitar información'},
            'it':{
              'title':'Trasporti e logistica','intro':'Teloni per camion, reti di contenimento, corde e cinghie fermacarico — gamma B2B per trasporti e distribuzione.',
              'groups':[
                ('Teloni per trasporto',[
                  ('CK300 — polietilene','Telone leggero in PE per protezione carichi. Dimensioni, colore e finiture su richiesta.','pe-ck300'),
                  ('CK400 — PVC','Telone PVC per veicoli commerciali e rimorchi, specifiche su richiesta.','pvc-ck400'),
                  ('CK500 e CK600 — PVC','Soluzioni PVC per coperture; le caratteristiche CK500 richiedono conferma.','pvc-ck600'),
                  ('Tela cerata di cotone','Tela cerata di cotone, incluso filo 08, per proteggere le merci.','algodao-encerado')]),
                ('Reti per camion',[
                  ('Rete nera','Rete nera per materiali riciclati, rottami e cereali; maglia e misure da confermare.','tela-preta'),
                  ('Rete grigia','Rete industriale grigia per contenimento dei carichi; specifiche da confermare.','tela-cinza')]),
                ('Fissaggio carichi',[
                  ('Corde','Corde in poliestere e altri materiali, vari diametri e confezioni.','cordas'),
                  ('Cinghie a cricchetto','Cinghie fermacarico con cricchetto e ganci, accessori di fissaggio.','cintas')])
              ],
              'applications':'Clienti e applicazioni','audiences':['Trasportatori e operatori logistici','Distributori di teloni, reti e accessori','Agroindustria, riciclaggio e carichi industriali','Magazzini e protezione attrezzature'],
              'quote':'Richiedi un preventivo tecnico','quoteText':'Indica materiale, misure, spessore o grammatura, colore, finiture, accessori, quantità e destinazione. Le specifiche saranno confermate.',
              'safety':'Le cinghie fermacarico non sono automaticamente idonee al sollevamento. Verificare i limiti del modello.',
              'note':'Fotografie originali dei prodotti. Fornitori e disponibilità non sono dichiarati pubblicamente.',
              'cta':'Richiedi informazioni'}
          }
          for lang,t in data.items():
            file=Path(lang)/'commerce'/'transport-logistics'/'index.html'
            code=file.read_text(encoding='utf-8')
            sections=[]
            for heading,rows in t['groups']:
              cards=[]
              for title,description,photo in rows:
                cards.append(f'<article class="zb-product-photo-card"><img src="../../../assets/logistics/{photo}.webp" alt="{html.escape(title)}" loading="lazy" decoding="async"><div class="zb-product-photo-copy"><h3>{html.escape(title)}</h3><p>{html.escape(description)}</p></div></article>')
              sections.append(f'<section class="zb-logistics-product-group"><h2>{html.escape(heading)}</h2><div class="zb-logistics-product-gallery">{"".join(cards)}</div></section>')
            app=''.join(f'<li>{html.escape(x)}</li>' for x in t['audiences'])
            body=f'<main class="zb-inner-page zb-logistics-page"><section class="subhero zb-inner-hero"><div class="wrap"><div class="eyebrow">ZABIELOS / B2B</div><h1>{t["title"]}</h1><p>{t["intro"]}</p></div></section><section class="section"><div class="wrap">{"".join(sections)}<div class="zb-logistics-applications"><div><h2>{t["applications"]}</h2><ul>{app}</ul></div><div class="zb-logistics-source-note"><h3>ZABIELOS / INTERNATIONAL TRADE</h3><p>{t["note"]}</p></div></div><div class="zb-logistics-quote"><div><h2>{t["quote"]}</h2><p>{t["quoteText"]}</p><p class="zb-logistics-safety">{t["safety"]}</p></div><a class="btn" href="../../contact/">{t["cta"]} →</a></div></div></section></main>'
            start=code.find('<main');end=code.find('</main>',start)
            assert start>=0 and end>start,file
            file.write_text(code[:start]+body+code[end+7:],encoding='utf-8')
            # Replace old generic or generated image in both catalog views.
            for rel in ('index.html','commerce/index.html'):
              page=Path(lang)/rel
              markup=page.read_text()
              prefix='../' if rel=='index.html' else '../../'
              newsrc=prefix+'assets/logistics/pvc-ck400.webp'
              import re
              needle=r'(<a class="zb-premium-card" href="(?:commerce/)?transport-logistics/">[\s\S]*?<img src=")[^"]+'
              markup,n=re.subn(needle,lambda m:m.group(1)+newsrc,markup,count=1)
              assert n==1,page
              page.write_text(markup)
          css=Path('assets/zabielos-clean.css')
          css.write_text(css.read_text()+"""
          /* Real product photography — logistics category */
          .zb-logistics-product-group{margin:0 0 46px}
          .zb-logistics-product-group>h2{font-size:clamp(26px,2.8vw,36px);margin:0 0 18px;border-left:5px solid #a3eb19;padding-left:16px}
          .zb-logistics-product-gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
          .zb-product-photo-card{background:#fff;border:1px solid #dfe8ed;border-radius:14px;overflow:hidden;box-shadow:0 8px 23px rgba(8,35,54,.07)}
          .zb-product-photo-card>img{width:100%;height:205px;object-fit:contain;display:block;background:#f9fbfc}
          .zb-product-photo-copy{padding:16px 18px 21px}
          .zb-product-photo-copy h3{font-size:18px;margin:0 0 10px}
          .zb-product-photo-copy p{font-size:14px;line-height:1.5;color:#566b78;margin:0}
          .zb-logistics-source-note{padding:28px;display:flex;flex-direction:column;justify-content:center}
          .zb-logistics-source-note h3{font-size:17px}
          .zb-logistics-source-note p{font-size:14px;color:#576c79}
          @media(max-width:1100px){.zb-logistics-product-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:650px){.zb-logistics-product-gallery{grid-template-columns:1fr}.zb-product-photo-card>img{height:260px}}
          """)
          # Discard staged originals (including the branded CK600 packaging photograph).
          shutil.rmtree(src)
          print('All 8 verified photos, 4 localized portfolios and 8 catalog references prepared')
          PY
          python3 /tmp/publish.py
      - name: Validate photographs, labels, anonymity, and all translations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          names=('pe-ck300','pvc-ck400','pvc-ck600','algodao-encerado','tela-preta','tela-cinza','cordas','cintas')
          for name in names:
            p=Path('assets/logistics')/(name+'.webp')
            assert p.is_file(),p
            with Image.open(p) as im:assert min(im.size)>=300,(p,im.size)
          for lang in ('pt','en','es','it'):
            p=Path(lang)/'commerce/transport-logistics/index.html'
            h=p.read_text()
            assert h.count('class="zb-product-photo-card"')==8,p
            for name in names:assert 'assets/logistics/'+name+'.webp' in h,(p,name)
            assert 'CIKALA' not in h.upper(),p
            assert 'assets/logistics/pvc-ck400.webp' in (Path(lang)/'index.html').read_text()
          assert not Path('assets/logistics-source').exists()
          print('Verified 8 authentic original photos and 4 multilingual pages, with no brand names')
          PY
      - name: Commit completed product galleries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/logistics assets/logistics-source pt en es it assets/zabielos-clean.css
          git commit -m "Publish only genuine unbranded CIKALA product photos in transport logistics portfolio"
          git push
