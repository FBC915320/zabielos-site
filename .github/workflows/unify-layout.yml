name: Apply approved design across all pages
on:
  push:
    paths: ['.github/workflows/unify-layout.yml']
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared design and navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          langs={
          'pt':(['Início','Serviços','Setores','Sobre','Contato'],'REPRESENTAÇÃO COMERCIAL<br>E NEGÓCIOS INTERNACIONAIS','Fale conosco','Vamos desenvolver negócios internacionais?','Apresente sua necessidade comercial e avaliaremos as possibilidades.','Setores de atuação',['Alimentos e Snacks','Embalagens Plásticas','Filmes e Embalagens','Transporte e Logística','Lazer e Proteção','Construção Civil']),
          'en':(['Home','Services','Sectors','About','Contact'],'COMMERCIAL REPRESENTATION<br>AND INTERNATIONAL BUSINESS','Contact us',"Let's develop international business.",'Share your commercial needs and we will evaluate opportunities.','Industry sectors',['Food & Snacks','Plastic Packaging','Films & Packaging','Transport & Logistics','Leisure & Protection','Construction']),
          'es':(['Inicio','Servicios','Sectores','Sobre','Contacto'],'REPRESENTACIÓN COMERCIAL<br>Y NEGOCIOS INTERNACIONALES','Contáctenos','Desarrollemos negocios internacionales.','Cuéntenos su necesidad comercial para evaluar oportunidades.','Sectores de actividad',['Alimentos y Snacks','Envases Plásticos','Películas y Envases','Transporte y Logística','Ocio y Protección','Construcción']),
          'it':(['Home','Servizi','Settori','Chi siamo','Contatti'],'RAPPRESENTANZA COMMERCIALE<br>E AFFARI INTERNAZIONALI','Contattaci','Sviluppiamo insieme affari internazionali.','Descrivi le tue esigenze commerciali per valutare le opportunità.','Settori di attività',['Alimenti e Snack','Imballaggi Plastici','Film e Imballaggi','Trasporti e Logistica','Tempo libero e Protezione','Edilizia'])
          }
          photos=['https://images.unsplash.com/photo-1601050690597-df0568f70950?w=650&q=80','https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?w=650&q=80','https://images.unsplash.com/photo-1605600659873-d808a13e4d9a?w=650&q=80','pvc-cover.webp','shade-sail.webp','https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=650&q=80']
          fallback=['tarpaulins.webp','pvc-cover.webp','tarpaulins.webp','pvc-cover.webp','shade-sail.webp','shade.webp']
          links=['food-consumer/','packaging/','packaging/','pvc-tarpaulins/','shade-sails/','industrial-supplies/']
          count=0
          for lang,t in langs.items():
            labels,strap,cta,cta_title,cta_desc,sector_title,sectors=t
            for f in Path(lang).rglob('index.html'):
              if f==Path(lang)/'index.html':continue
              s=f.read_text(encoding='utf-8')
              depth=len(f.parent.parts)
              prefix='../'*depth
              navpaths=[f'{lang}/',f'{lang}/services/',f'{lang}/commerce/',f'{lang}/about/',f'{lang}/contact/']
              nav=''.join(f'<a href="{prefix}{p}">{label}</a>' for label,p in zip(labels,navpaths))
              header=f'<header class="head zb-site-header"><div class="wrap headrow"><a class="zb-logo-link" href="{prefix}{lang}/" aria-label="ZABIELOS"><img class="logo" alt="ZABIELOS" src="{prefix}assets/zabielos-logo-official.png"></a><span class="zb-header-tagline">{strap}</span><nav class="nav" id="nav">{nav}</nav><select class="lang" id="lang" aria-label="Language">'+''.join(f'<option value="{x}"'+(' selected' if x==lang else '')+f'>{x.upper()}</option>' for x in ('pt','en','es','it'))+'</select><button class="hamb" id="hamb" aria-expanded="false" aria-controls="nav" aria-label="Menu">☰</button></div></header>'
              s=re.sub(r'<header class="head">.*?</header>',lambda m:header,s,count=1,flags=re.S)
              s=s.replace('<main>','<main class="zb-inner-page">',1)
              s=s.replace('<section class="subhero">','<section class="subhero zb-inner-hero">',1)
              if f==Path(lang)/'commerce'/'index.html':
                cards=[]
                for i,n in enumerate(sectors):
                  src=photos[i] if photos[i].startswith('http') else prefix+'assets/products/'+photos[i]
                  fb=prefix+'assets/products/'+fallback[i]
                  cards.append(f'<a class="zb-premium-card" href="{links[i]}"><div class="zb-premium-photo"><img src="{src}" alt="{n}" loading="lazy" onerror="this.onerror=null;this.src=\'{fb}\'"></div><div class="zb-premium-card-label"><strong>{n}</strong><span class="zb-premium-arrow">→</span></div></a>')
                section='<section class="section zb-inner-content"><div class="wrap"><div class="zb-premium-grid">'+''.join(cards)+'</div></div></section>'
                s=re.sub(r'<section class="section">.*?</section>',lambda m:section,s,count=1,flags=re.S)
              if f==Path(lang)/'services'/'index.html':
                s=s.replace('<div class="cards">','<div class="cards zb-service-cards">',1)
              if f==Path(lang)/'contact'/'index.html':
                s=s.replace('<div class="wrap two">','<div class="wrap two zb-contact-grid">',1)
              if f.parts[1] not in ('contact','privacy'):
                cta_html=f'<section class="zb-inner-cta"><div class="wrap"><div><h2>{cta_title}</h2><p>{cta_desc}</p></div><a href="{prefix}{lang}/contact/">{cta} →</a></div></section>'
                s=s.replace('</main>',cta_html+'</main>',1)
              f.write_text(s,encoding='utf-8')
              count+=1
          css=Path('assets/site.css')
          css.write_text(css.read_text()+"""
          /* Premium unified layout across inner pages */
          .zb-inner-page{min-height:65vh}
          .zb-inner-hero{background:linear-gradient(95deg,rgba(4,29,53,.98),rgba(5,45,74,.88)),url('https://images.unsplash.com/photo-1578575437130-527eed3abbec?w=1500&q=70') center/cover no-repeat;padding:66px 0 70px}
          .zb-inner-hero .wrap,.zb-inner-cta .wrap{width:min(1350px,100%);padding-left:clamp(22px,4vw,55px);padding-right:clamp(22px,4vw,55px)}
          .zb-inner-hero .eyebrow{color:#a3ed14}
          .zb-inner-hero h1{font-size:clamp(38px,4.2vw,62px);line-height:1.08;max-width:1000px;letter-spacing:-.04em;margin:15px 0 12px;border-left:5px solid #a3ed14;padding-left:22px}
          .zb-inner-hero p{font-size:clamp(16px,1.6vw,20px);max-width:850px;line-height:1.5}
          .zb-inner-page .section{padding-top:65px;padding-bottom:70px}
          .zb-inner-page .card{border-radius:14px;box-shadow:0 7px 25px #08283e0d;transition:transform .2s,box-shadow .2s}
          .zb-inner-page .card:hover{transform:translateY(-3px);box-shadow:0 14px 32px #08283e20}
          .zb-inner-page .feature{border-radius:12px;background:#f1f6f5;padding:30px;border-left:5px solid #a3ed14}
          .zb-inner-page .form{border-radius:15px;background:#f7faf9;box-shadow:0 10px 35px #0b344110}
          .zb-inner-page .field input,.zb-inner-page .field textarea{background:white;border:1px solid #c6d5db}
          .zb-inner-page .btn{background:#a3ed14;color:#08233b;border-radius:10px}
          .zb-inner-page .note{background:#f5f9f6;border-radius:0 8px 8px 0}
          .zb-inner-cta{background:linear-gradient(105deg,#06223b,#0b4363);color:white;padding:35px 0}
          .zb-inner-cta .wrap{display:flex;justify-content:space-between;align-items:center;gap:30px}
          .zb-inner-cta h2{font-size:clamp(23px,2.7vw,34px);margin:0 0 8px}
          .zb-inner-cta p{margin:0;color:#d4e3e9}
          .zb-inner-cta a{display:inline-block;background:#a3ed14;border-radius:10px;padding:14px 25px;color:#06223b;font-weight:800;white-space:nowrap}
          .zb-inner-content .zb-premium-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
          .zb-service-cards{grid-template-columns:repeat(3,minmax(0,1fr))}
          @media(max-width:900px){.zb-inner-content .zb-premium-grid,.zb-service-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:600px){.zb-inner-hero{padding:48px 0 52px}.zb-inner-hero h1{font-size:36px}.zb-inner-page .section{padding-top:40px;padding-bottom:45px}.zb-inner-content .zb-premium-grid,.zb-service-cards{grid-template-columns:1fr}.zb-inner-page .two{grid-template-columns:1fr;gap:22px}.zb-inner-cta .wrap{flex-direction:column;align-items:flex-start}.zb-inner-cta a{width:100%;text-align:center}}
          """)
          print('Updated',count,'inner pages')
          PY
      - name: Commit new site-wide design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt en es it assets/site.css
          git commit -m "Apply approved premium layout to all multilingual inner pages"
          git push
