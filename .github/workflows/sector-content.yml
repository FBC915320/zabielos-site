name: Build accurate sector detail pages
on:
  push:
    paths: ['.github/workflows/sector-content.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sector pages and correct links
        run: |
          cat > /tmp/sectors.py <<'PY'
          from pathlib import Path
          import re,html
          data={
          'pt':[
          ('Alimentos e snacks','Biscoitos, crackers, snacks salgados, amendoins e alimentos industrializados.','Linhas de produtos','Biscoitos e crackers|Snacks de milho, mandioca e banana|Amendoins e aperitivos|Opções especiais e marca própria, mediante confirmação','O que precisamos para uma cotação','Tipo de produto, sabores, embalagem, peso líquido, quantidade por pedido, país de destino e requisitos sanitários.','Avaliamos fornecedores e condições comerciais conforme cada solicitação. Não há promessa de representação, estoque ou fornecimento.'),
          ('Embalagens plásticas','Soluções para acondicionamento, apresentação e proteção de alimentos e outros produtos.','Linhas de produtos','Copos e tampas|Pratos e bandejas|Embalagens termoformadas PET|Potes e recipientes para alimentos','O que precisamos para uma cotação','Formato, dimensões, material, capacidade, transparência, volume por pedido, destino e exigências para contato com alimentos.','Materiais reciclados e certificações dependem de comprovação específica do fabricante.'),
          ('Filmes e embalagens flexíveis','Filmes plásticos e soluções flexíveis para embalagem, paletização e proteção.','Linhas de produtos','Filme stretch para paletes|Filmes em bobinas|Sacos e embalagens flexíveis|Materiais de proteção para transporte','O que precisamos para uma cotação','Tipo de filme, largura, espessura, metragem, aplicação, quantidade, embalagem e país de destino.','Características técnicas, composição e disponibilidade são verificadas caso a caso.'),
          ('Transporte e logística','Materiais de cobertura, proteção e acondicionamento para operações logísticas.','Linhas de produtos','Lonas para caminhões e cargas|Coberturas e proteção de mercadorias|Materiais para armazenagem|Acessórios de fixação e proteção','O que precisamos para uma cotação','Aplicação, medidas, gramatura, resistência, acabamento, quantidade e destino.','A seleção depende das condições de uso e da especificação técnica.'),
          ('Lazer e proteção','Soluções para sombreamento, áreas externas, piscinas e proteção contra intempéries.','Linhas de produtos','Telas de sombreamento|Velas tensionadas e coberturas|Lonas e capas para piscinas|Proteções para áreas externas','O que precisamos para uma cotação','Dimensões, formato, exposição ao sol e vento, material, cor, fixação e quantidade.','A adequação estrutural e a instalação devem ser avaliadas para cada projeto.'),
          ('Construção civil','Materiais técnicos para cobertura, proteção de áreas de obra e aplicações temporárias.','Linhas de produtos','Lonas de proteção para obras|Telas e redes técnicas|Coberturas provisórias|Filmes e materiais de isolamento e proteção','O que precisamos para uma cotação','Tipo de obra, aplicação, dimensões, resistência requerida, normas aplicáveis, quantidade e destino.','A especificação e as exigências regulatórias precisam ser confirmadas antes do fornecimento.')
          ],
          'en':[
          ('Food and snacks','Biscuits, crackers, savory snacks, peanuts and processed food products.','Product lines','Biscuits and crackers|Corn, cassava and banana snacks|Peanuts and appetizers|Specialty products and private label, subject to confirmation','Information for quotation','Product type, flavors, packaging, net weight, order volume, destination country and food regulatory requirements.','We evaluate suppliers and commercial terms for each inquiry; no inventory or representation is implied.'),
          ('Plastic packaging','Packaging for food presentation, storage and product protection.','Product lines','Cups and lids|Plates and trays|PET thermoformed packaging|Food containers','Information for quotation','Shape, dimensions, material, capacity, clarity, order volume, destination and food-contact requirements.','Recycled content and certifications require manufacturer-specific verification.'),
          ('Films and flexible packaging','Flexible plastic films for wrapping, palletizing and product protection.','Product lines','Stretch wrap for pallets|Film rolls|Flexible bags and packaging|Protective shipping materials','Information for quotation','Film type, width, thickness, length, application, quantity, packing and destination.','Specifications, composition and availability are confirmed case by case.'),
          ('Transport and logistics','Protective covers and materials for freight and logistics operations.','Product lines','Truck and cargo tarpaulins|Goods protection covers|Warehouse protection materials|Fastening accessories','Information for quotation','Application, dimensions, fabric weight, durability, finishing, quantity and destination.','Material selection depends on the intended application and technical requirements.'),
          ('Leisure and protection','Shading and protective solutions for outdoor areas and swimming pools.','Product lines','Shade netting|Tensioned shade sails|Pool covers and tarpaulins|Outdoor protective materials','Information for quotation','Dimensions, shape, sun and wind exposure, material, color, fastening and quantity.','Structural suitability and installation must be assessed for each project.'),
          ('Construction','Technical materials for construction site covers and temporary protection.','Product lines','Construction protection tarpaulins|Technical nets and screens|Temporary covers|Protective films and barriers','Information for quotation','Construction application, dimensions, required strength, applicable standards, quantity and destination.','Specifications and regulatory requirements must be verified before supply.')
          ],
          'es':[
          ('Alimentos y snacks','Galletas, crackers, aperitivos, cacahuetes y alimentos industrializados.','Líneas de productos','Galletas y crackers|Snacks de maíz, mandioca y banana|Cacahuetes y aperitivos|Productos especiales y marca propia sujetos a confirmación','Datos para cotizar','Producto, sabores, envase, peso neto, volumen, destino y requisitos sanitarios.','Se evalúan proveedores y condiciones caso por caso; no se presume representación ni existencias.'),
          ('Envases plásticos','Envases para alimentos, presentación y protección de productos.','Líneas de productos','Vasos y tapas|Platos y bandejas|Envases termoformados PET|Recipientes alimentarios','Datos para cotizar','Formato, dimensiones, material, capacidad, transparencia, volumen, destino y normas de contacto alimentario.','Contenido reciclado y certificaciones requieren verificación del fabricante.'),
          ('Películas y envases flexibles','Películas plásticas para embalaje, paletización y protección.','Líneas de productos','Film stretch para palés|Películas en bobinas|Bolsas y envases flexibles|Materiales de protección para transporte','Datos para cotizar','Tipo, ancho, espesor, longitud, aplicación, cantidad, embalaje y destino.','Las especificaciones y disponibilidad se verifican caso por caso.'),
          ('Transporte y logística','Lonas y materiales de protección para operaciones logísticas.','Líneas de productos','Lonas para camiones|Cubiertas de protección|Materiales para almacenes|Accesorios de fijación','Datos para cotizar','Aplicación, medidas, gramaje, resistencia, acabado, cantidad y destino.','La selección depende de las condiciones de uso y especificaciones.'),
          ('Ocio y protección','Soluciones de sombreo, protección exterior y piscinas.','Líneas de productos','Mallas de sombreo|Velas tensadas|Cubiertas de piscinas|Protección para exteriores','Datos para cotizar','Medidas, forma, exposición al sol y viento, material, color, fijación y cantidad.','La idoneidad estructural debe evaluarse para cada proyecto.'),
          ('Construcción','Materiales técnicos para protección de obras y cubiertas temporales.','Líneas de productos','Lonas de obra|Mallas y redes técnicas|Cubiertas temporales|Películas protectoras','Datos para cotizar','Aplicación, dimensiones, resistencia, normas, cantidad y destino.','Las especificaciones y exigencias legales deben confirmarse.')
          ],
          'it':[
          ('Alimenti e snack','Biscotti, cracker, snack salati, arachidi e alimenti confezionati.','Linee di prodotto','Biscotti e cracker|Snack di mais, manioca e banana|Arachidi e aperitivi|Prodotti speciali e private label da confermare','Dati per il preventivo','Tipo di prodotto, gusti, confezione, peso, quantità, destinazione e requisiti alimentari.','Fornitori e condizioni vengono valutati caso per caso; non si presume rappresentanza o disponibilità.'),
          ('Imballaggi plastici','Contenitori per alimenti, presentazione e protezione dei prodotti.','Linee di prodotto','Bicchieri e coperchi|Piatti e vassoi|Imballaggi termoformati PET|Contenitori alimentari','Dati per il preventivo','Formato, misure, materiale, capacità, trasparenza, volume, destinazione e norme per il contatto alimentare.','Materiale riciclato e certificazioni richiedono verifica del produttore.'),
          ('Film e imballaggi flessibili','Film plastici per imballaggio, pallettizzazione e protezione.','Linee di prodotto','Film estensibile per pallet|Film in bobine|Sacchetti e imballaggi flessibili|Materiali protettivi per trasporto','Dati per il preventivo','Tipo, larghezza, spessore, lunghezza, applicazione, quantità, confezione e destinazione.','Specifiche e disponibilità sono verificate caso per caso.'),
          ('Trasporti e logistica','Coperture e materiali protettivi per trasporti e logistica.','Linee di prodotto','Teloni per camion e carichi|Coperture protettive|Materiali per magazzino|Accessori di fissaggio','Dati per il preventivo','Applicazione, misure, grammatura, resistenza, finiture, quantità e destinazione.','La scelta dipende dalle condizioni d’uso e dalle specifiche.'),
          ('Tempo libero e protezione','Soluzioni di ombreggiamento e protezione per esterni e piscine.','Linee di prodotto','Reti ombreggianti|Vele tensionate|Coperture per piscine|Protezioni per esterni','Dati per il preventivo','Misure, forma, esposizione a sole e vento, materiale, colore, fissaggio e quantità.','Idoneità strutturale e installazione vanno valutate per ogni progetto.'),
          ('Edilizia','Materiali tecnici per cantieri e coperture temporanee.','Linee di prodotto','Teloni per cantieri|Reti e schermi tecnici|Coperture temporanee|Film e barriere protettive','Dati per il preventivo','Applicazione, misure, resistenza, norme, quantità e destinazione.','Specifiche e requisiti normativi devono essere confermati.')
          ]}
          slugs=['food-consumer','packaging','flexible-films','transport-logistics','leisure-protection','construction']
          photos=['https://images.unsplash.com/photo-1601050690597-df0568f70950?w=900&q=80','https://environment.ec.europa.eu/sites/default/files/styles/ewcms_metatag_image/public/2026-01/GettyImages-1222359828.jpg?h=119335f7&itok=TgiYXBYl','../../../assets/products/tarpaulins.webp','../../../assets/products/pvc-cover.webp','../../../assets/products/shade-sail.webp','../../../assets/products/shade.webp']
          navs={'pt':['Início','Serviços','Setores','Sobre','Contato'],'en':['Home','Services','Sectors','About','Contact'],'es':['Inicio','Servicios','Sectores','Sobre','Contacto'],'it':['Home','Servizi','Settori','Chi siamo','Contatti']}
          for lang,entries in data.items():
            template=(Path(lang)/'commerce'/'food-consumer'/'index.html').read_text(encoding='utf-8')
            for i,entry in enumerate(entries):
              title,description,products,items,ask,questions,note=entry
              path=Path(lang)/'commerce'/slugs[i]/'index.html'
              path.parent.mkdir(parents=True,exist_ok=True)
              page=template
              page=re.sub(r'<title>.*?</title>',f'<title>{html.escape(title)} | ZABIELOS</title>',page,count=1)
              page=re.sub(r'<meta name="description" content="[^"]*"',f'<meta name="description" content="{html.escape(description,quote=True)}"',page,count=1)
              page=re.sub(r'<link rel="canonical" href="[^"]*"',f'<link rel="canonical" href="https://zabielos.com/{lang}/commerce/{slugs[i]}/"',page,count=1)
              for x in ('pt','en','es','it'):
                page=re.sub(r'(<link rel="alternate" hreflang="'+x+r'" href=")[^"]*"',lambda m:m.group(1)+f'https://zabielos.com/{x}/commerce/{slugs[i]}/"',page,count=1)
              nav=''.join(f'<a href="../../../{lang}/{dest}">{label}</a>' for label,dest in zip(navs[lang],['','services/','commerce/','about/','contact/']))
              page=re.sub(r'<nav class="nav" id="nav">.*?</nav>',lambda m:'<nav class="nav" id="nav">'+nav+'</nav>',page,count=1,flags=re.S)
              cards=''.join(f'<li>{html.escape(v)}</li>' for v in items.split('|'))
              body=f'<main class="zb-inner-page"><section class="subhero zb-inner-hero"><div class="wrap"><div class="eyebrow">ZABIELOS / B2B SECTORS</div><h1>{html.escape(title)}</h1><p>{html.escape(description)}</p></div></section><section class="section zb-sector-detail"><div class="wrap"><div class="zb-sector-detail-top"><img src="{photos[i].replace("&","&amp;")}" alt="{html.escape(title)}" loading="lazy"><div><h2>{html.escape(products)}</h2><ul>{cards}</ul></div></div><div class="zb-sector-quote"><div><h2>{html.escape(ask)}</h2><p>{html.escape(questions)}</p><p class="note">{html.escape(note)}</p></div><a class="btn" href="../../contact/">{html.escape(navs[lang][-1])} →</a></div></div></section></main>'
              start=page.find('<main')
              end=page.find('</main>',start)
              if start<0 or end<0:raise RuntimeError('Main section not found: '+str(path))
              page=page[:start]+body+page[end+7:]
              path.write_text(page,encoding='utf-8')
            for rel in ('index.html','commerce/index.html'):
              p=Path(lang)/rel
              s=p.read_text(encoding='utf-8')
              links=list(re.finditer(r'<a class="zb-premium-card"[^>]*>',s))
              for i,m in reversed(list(enumerate(links[:6]))):
                s=s[:m.start()]+re.sub(r'href="[^"]*"',f'href="commerce/{slugs[i]}/"' if rel=='index.html' else f'href="{slugs[i]}/"',m.group(),count=1)+s[m.end():]
              p.write_text(s,encoding='utf-8')
          css=Path('assets/zabielos-clean.css')
          css.write_text(css.read_text()+"""
          .zb-sector-detail-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:42px;align-items:center}
          .zb-sector-detail-top>img{width:100%;height:350px;object-fit:cover;border-radius:16px;background:#e5edf1}
          .zb-sector-detail-top h2,.zb-sector-quote h2{margin:0 0 18px}
          .zb-sector-detail-top ul{padding-left:22px;line-height:2;font-size:17px}
          .zb-sector-detail-top li::marker{color:#65a927}
          .zb-sector-quote{margin-top:45px;background:#f1f7f6;border-radius:15px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:25px}
          .zb-sector-quote>div{max-width:850px}
          .zb-sector-quote p{color:#536a7b}
          .zb-sector-quote .note{font-size:13px}
          .zb-sector-quote .btn{flex-shrink:0}
          @media(max-width:750px){.zb-sector-detail-top{grid-template-columns:1fr;gap:24px}.zb-sector-detail-top>img{height:230px}.zb-sector-quote{flex-direction:column;align-items:stretch;padding:22px}.zb-sector-quote .btn{text-align:center}}
          """)
          print('Generated',len(data)*6,'sector pages and updated all 8 catalog/home pages')
          PY
      - name: Validate links and pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          slugs=['food-consumer','packaging','flexible-films','transport-logistics','leisure-protection','construction']
          for lang in ('pt','en','es','it'):
            for slug in slugs:
              p=Path(lang)/'commerce'/slug/'index.html'
              assert p.exists(),p
              s=p.read_text()
              assert '<ul>' in s and 'zb-sector-quote' in s,p
            for rel in ('index.html','commerce/index.html'):
              s=(Path(lang)/rel).read_text()
              for slug in slugs:assert slug+'/' in s,(lang,rel,slug)
          print('All 24 detail pages and 48 navigation links verified')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt en es it assets/zabielos-clean.css
          git commit -m "Build complete localized content and correct navigation for six commercial sectors"
          git push
