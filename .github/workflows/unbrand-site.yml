name: Remove supplier branding from public Zabielos
on:
  push:
    paths: ['.github/workflows/unbrand-site.yml']
permissions:
  contents: write
jobs:
  unbrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild public site as neutral international representation portal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,shutil
          cfg={
          'pt':{'nav':['Início','Serviços','Setores','Sobre','Contato'],'heading':'Setores de atuação','intro':'Representação comercial internacional e desenvolvimento de mercados para diferentes segmentos. Produtos e condições sujeitos à confirmação comercial.','sectors':['Alimentos e snacks','Embalagens plásticas','Filmes e embalagens flexíveis','Transporte e logística','Lonas e tecidos técnicos','Construção e proteção'],'desc':['Biscoitos, crackers, snacks e alimentos industrializados.','Copos, pratos, bandejas e embalagens termoformadas.','Filmes plásticos, bobinas e embalagens flexíveis.','Materiais para transporte, coberturas e proteção de cargas.','Lonas, telas, tecidos técnicos e soluções de sombreamento.','Materiais técnicos para obras e proteção industrial.'],'button':'Conhecer segmento','notice':'Os fabricantes são identificados durante a negociação comercial. Nenhuma representação ou disponibilidade é presumida.','cta':'Fale conosco','page':'Setores e produtos','contact':'Apresente sua necessidade comercial'},
          'en':{'nav':['Home','Services','Sectors','About','Contact'],'heading':'Industry sectors','intro':'International commercial representation and market development across multiple sectors. Products and terms subject to commercial confirmation.','sectors':['Food and snacks','Plastic packaging','Films and flexible packaging','Transport and logistics','Technical tarpaulins and fabrics','Construction and protection'],'desc':['Biscuits, crackers, snacks and processed foods.','Cups, plates, trays and thermoformed packaging.','Plastic films, rolls and flexible packaging.','Transport materials, covers and cargo protection.','Tarpaulins, nets, technical fabrics and shading solutions.','Technical materials for construction and industrial protection.'],'button':'Explore sector','notice':'Manufacturers are identified during commercial negotiations. Representation and availability are not presumed.','cta':'Contact us','page':'Sectors and products','contact':'Tell us what you need'},
          'es':{'nav':['Inicio','Servicios','Sectores','Sobre','Contacto'],'heading':'Sectores de actividad','intro':'Representación comercial internacional y desarrollo de mercados en diversos segmentos. Productos y condiciones sujetos a confirmación.','sectors':['Alimentos y snacks','Envases plásticos','Películas y envases flexibles','Transporte y logística','Lonas y tejidos técnicos','Construcción y protección'],'desc':['Galletas, crackers, snacks y alimentos industrializados.','Vasos, platos, bandejas y envases termoformados.','Películas plásticas, bobinas y envases flexibles.','Materiales de transporte y protección de cargas.','Lonas, mallas, tejidos técnicos y sombreo.','Materiales técnicos para obras y protección industrial.'],'button':'Conocer sector','notice':'Los fabricantes se identifican durante la negociación. No se presume representación ni disponibilidad.','cta':'Contáctenos','page':'Sectores y productos','contact':'Presente su necesidad comercial'},
          'it':{'nav':['Home','Servizi','Settori','Chi siamo','Contatti'],'heading':'Settori di attività','intro':'Rappresentanza commerciale internazionale e sviluppo dei mercati in diversi settori. Prodotti e condizioni da confermare.','sectors':['Alimenti e snack','Imballaggi plastici','Film e imballaggi flessibili','Trasporti e logistica','Teloni e tessuti tecnici','Edilizia e protezione'],'desc':['Biscotti, cracker, snack e alimenti confezionati.','Bicchieri, piatti, vassoi e contenitori termoformati.','Film plastici, bobine e imballaggi flessibili.','Materiali per trasporto e protezione dei carichi.','Teloni, reti, tessuti tecnici e ombreggiamento.','Materiali tecnici per edilizia e protezione industriale.'],'button':'Scopri settore','notice':'I produttori vengono identificati durante la trattativa. Nessuna rappresentanza o disponibilità è presunta.','cta':'Contattaci','page':'Settori e prodotti','contact':'Descrivi le tue esigenze'}
          }
          photos=['','', '', 'pvc-cover.webp','tarpaulins.webp','']
          links=['food-consumer/','packaging/','packaging/','pvc-tarpaulins/','technical-textiles/','technical-textiles/']
          for lang,c in cfg.items():
            root=Path(lang)
            for f in root.rglob('index.html'):
              if 'brands' in f.parts:continue
              s=f.read_text(encoding='utf-8')
              depth=len(f.parent.parts)
              prefix='../'*depth
              navpaths=[f'{lang}/',f'{lang}/services/',f'{lang}/commerce/',f'{lang}/about/',f'{lang}/contact/']
              nav='<nav class="nav" id="nav">'+''.join(f'<a href="{prefix}{p}">{name}</a>' for name,p in zip(c['nav'],navpaths))+'</nav>'
              s=re.sub(r'<nav class="nav" id="nav">.*?</nav>',lambda m:nav,s,count=1,flags=re.S)
              s=re.sub(r'<a[^>]+href="[^"]*brands/[^"]*"[^>]*>.*?</a>','',s,flags=re.S)
              s=re.sub(r'<link[^>]+href="[^"]*/brands/[^"]*"[^>]*>','',s)
              # Neutralize supplier and product-line names throughout all visible copy and metadata.
              s=re.sub(r'(?i)SHADE SAIL',{'pt':'velas de sombreamento','en':'shade sails','es':'velas de sombra','it':'vele ombreggianti'}[lang],s)
              s=re.sub(r'(?i)CIKALA','',s)
              s=re.sub(r'(?i)CK300','',s)
              s=re.sub(r'(?i)CK600','',s)
              # Only replace the SHADE name as a standalone word in visible text, not file paths.
              s=re.sub(r'(?i)(?<![/\\w.-])SHADE(?![/\\w.-])',{'pt':'sombreamento','en':'shading','es':'sombreo','it':'ombreggiamento'}[lang],s)
              s=re.sub(r'\s{2,}', ' ', s)
              if f==root/'index.html':
                cards=[]
                for i,(name,desc) in enumerate(zip(c['sectors'],c['desc'])):
                  image=(f'<img src="../assets/products/{photos[i]}" alt="{name}" loading="lazy">' if photos[i] else '')
                  cards.append(f'<article class="zb-sector-card"><a href="commerce/{links[i]}"><div class="zb-sector-image {("zb-sector-placeholder" if not image else "")}">{image}</div><div class="zb-sector-text"><span>0{i+1}</span><h3>{name}</h3><p>{desc}</p><strong>{c["button"]} →</strong></div></a></article>')
                section=f'<section class="zb-neutral-sectors"><div class="wrap"><div class="zb-section-head"><h2>{c["heading"]}</h2><a href="commerce/">{c["page"]} →</a></div><p class="lead">{c["intro"]}</p><div class="zb-neutral-grid">{"".join(cards)}</div><p class="zb-disclaimer">{c["notice"]}</p></div></section>'
                s=re.sub(r'<section class="zb-companies section">.*?</section>',lambda m:section,s,count=1,flags=re.S)
                s=re.sub(r'<section class="zb-sectors">.*?</section>','',s,count=1,flags=re.S)
              if f==root/'commerce'/'index.html':
                cards=[]
                for i,(name,desc) in enumerate(zip(c['sectors'],c['desc'])):
                  image=f'<div class="product-visual"><img src="../../assets/products/{photos[i]}" alt="{name}" loading="lazy"></div>' if photos[i] else ''
                  cards.append(f'<article class="card product-card zb-neutral-card">{image}<small>0{i+1}</small><h3>{name}</h3><p>{desc}</p><a href="{links[i]}">{c["button"]} →</a></article>')
                s=re.sub(r'<section class="subhero">.*?</section>',lambda m:f'<section class="subhero"><div class="wrap"><div class="eyebrow">ZABIELOS / GLOBAL BUSINESS</div><h1>{c["page"]}</h1><p>{c["intro"]}</p></div></section>',s,count=1,flags=re.S)
                s=re.sub(r'<section class="section">.*?</section>',lambda m:f'<section class="section"><div class="wrap"><div class="cards showcase">{"".join(cards)}</div><p class="note">{c["notice"]}</p></div></section>',s,count=1,flags=re.S)
              f.write_text(s,encoding='utf-8')
            shutil.rmtree(root/'brands',ignore_errors=True)
          # Do not publish supplier logo assets.
          shutil.rmtree('assets/brands',ignore_errors=True)
          css=Path('assets/site.css')
          css.write_text(css.read_text()+"""
          /* Neutral B2B sector-led identity, no supplier branding */
          .zb-neutral-sectors{padding:48px 0 55px;background:#fff}
          .zb-neutral-sectors .lead{max-width:800px;margin:15px 0 24px}
          .zb-neutral-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
          .zb-sector-card{border:1px solid #e0e7e8;border-radius:13px;overflow:hidden;background:white;box-shadow:0 5px 20px #06243610}
          .zb-sector-card>a{display:block;height:100%;color:inherit}
          .zb-sector-card>a:hover{text-decoration:none}
          .zb-sector-image{height:170px;background:linear-gradient(135deg,#dbe9e9,#9fc3d3);overflow:hidden}
          .zb-sector-image img{width:100%;height:100%;object-fit:cover}
          .zb-sector-text{padding:18px 20px 22px}
          .zb-sector-text span{color:#669c2e;font-size:12px;font-weight:800}
          .zb-sector-text h3{margin:7px 0;font-size:20px}
          .zb-sector-text p{font-size:14px;color:#5a6d77;min-height:58px}
          .zb-sector-text strong{color:#337034;font-size:13px}
          .zb-neutral-card{min-height:230px}
          .zb-neutral-card h3,.zb-neutral-card p,.zb-neutral-card a{padding-left:22px;padding-right:22px}
          @media(max-width:900px){.zb-neutral-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:600px){.zb-neutral-grid{grid-template-columns:1fr}.zb-sector-image{height:190px}}
          """)
          # Strip old brand URLs from the XML sitemap.
          sitemap=Path('sitemap.xml')
          if sitemap.exists():
            text=sitemap.read_text()
            text=re.sub(r'<url>\s*<loc>[^<]*/brands/[^<]*</loc>\s*</url>','',text)
            sitemap.write_text(text)
          print('Removed public brands and neutralized all language pages.')
          PY
      - name: Validate no public brand references remain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=('CIKALA','SHADE SAIL','CK300','CK600')
          issues=[]
          for lang in ('pt','en','es','it'):
            for f in Path(lang).rglob('*.html'):
              s=f.read_text()
              for n in names:
                if re.search(r'(?i)'+re.escape(n),s):issues.append((str(f),n))
              if '/brands/' in s:issues.append((str(f),'brands route'))
          if issues:
            print('Remaining references:',issues[:35])
            raise SystemExit(1)
          print('Verified: no old supplier brand names or brand routes in public HTML')
          PY
      - name: Commit neutral representation site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pt en es it assets/site.css assets/brands sitemap.xml
          git commit -m "Remove all supplier brands and switch Zabielos to neutral sector representation"
          git push
