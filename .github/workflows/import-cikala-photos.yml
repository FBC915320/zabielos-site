name: Import authentic CIKALA transport product photographs
on:
  push:
    paths: ['.github/workflows/import-cikala-photos.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lightweight image utilities
        run: python3 -m pip install --user pillow beautifulsoup4
      - name: Download only genuine source photographs
        run: |
          cat > /tmp/collect.py <<'PY'
          from pathlib import Path
          import requests,bs4,re,html,io
          from PIL import Image
          sources={
            'lona-pe-ck300':'https://www.cikala.com.br/lona-de-caminh-o-azul-ck300-micras-leve-cobertura-de-carga-m2',
            'lona-pvc-ck400':'https://www.cikala.com.br/lona-de-caminh-o-azul-x-preta-ck400-micras-em-pvc-seguranca-e-resistencia-para-sua-carga',
            'lona-pvc-ck600':'https://www.cikala.com.br/lona-de-caminh-o-cinza-x-preta-emborrachada-ck600-micras-a-soluc-o-perfeita-para-protec-o-e-transporte-seguro',
            'lona-algodao':'https://www.cikala.com.br/lona-encerado-caqui-fio-08-para-caminh-o-impermeavel-e-perfeita-para-cargas-pesadas',
            'tela-preta':'https://www.cikala.com.br/tela-para-caminh-o-preta-80-transporte-de-gr-os-reciclaveis-e-sucatas',
            'tela-cinza':'https://www.cikala.com.br/tela-industrial-cinza-para-caminh-o-ideal-para-transportes-de-reciclaveis-gr-os-e-sucatas',
            'corda':'https://www.cikala.com.br/corda-poliester-10mm-trancada-branca-multiuso-resistente-para-amarrac-o',
            'cinta':'https://www.cikala.com.br/cinta-amarrac-o-15-metros-3-ton-gancho-j-catraca-gancho-j-13305'
          }
          out=Path('assets/logistics-source');out.mkdir(parents=True,exist_ok=True)
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36'})
          for key,page in sources.items():
            try:
              response=session.get(page,timeout=35);response.raise_for_status()
              soup=bs4.BeautifulSoup(response.text,'html.parser')
              urls=[]
              for tag in soup.find_all('meta'):
                if tag.get('property') in ('og:image','og:image:secure_url') or tag.get('itemprop')=='image':
                  src=tag.get('content')
                  if src:urls.append(src)
              # Product-specific media instead of generic logo or category banner.
              for node in soup.select('img[itemprop=image], .product-image-photo, .product.media img, .product-image img'):
                src=node.get('data-src') or node.get('src') or node.get('data-original')
                if src:urls.append(src)
              print('SOURCE',key,'page',page,'candidates',urls[:4],flush=True)
              downloaded=False
              for url in urls:
                if url.startswith('//'):url='https:'+url
                if not url.startswith('https://'):continue
                if not (url.split('/')[2].endswith('cikala.com.br')):continue
                try:
                  r=session.get(url,timeout=35);r.raise_for_status()
                  im=Image.open(io.BytesIO(r.content)).convert('RGB')
                  if min(im.size)<400:continue
                  im.thumbnail((1200,1200),Image.Resampling.LANCZOS)
                  im.save(out/(key+'.webp'),'WEBP',quality=87,method=6)
                  print('SAVED',key,'dimensions',im.size,'url',url,flush=True)
                  downloaded=True
                  break
                except Exception as e:print('IMAGE_ERROR',key,str(e)[:120],flush=True)
              if not downloaded:print('NO_IMAGE',key,flush=True)
            except Exception as e:print('PAGE_ERROR',key,str(e)[:200],flush=True)
          PY
          python3 /tmp/collect.py
      - name: Commit staged source photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logistics-source
          if ! git diff --cached --quiet; then
            git commit -m "Stage authentic unmodified CIKALA transport product photographs for review"
            git push
          fi
