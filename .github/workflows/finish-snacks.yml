name: Finish snack imagery
on:
  push:
    paths: ['.github/workflows/finish-snacks.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image processing dependency
        run: python3 -m pip install --user Pillow
      - name: Download and validate unbranded packaged snacks photo
        run: |
          python3 - <<'PY'
          import urllib.request,io
          from pathlib import Path
          from PIL import Image
          url='https://farmtohome.com.pk/cdn/shop/collections/snacks_confectionery.webp?v=1759654648'
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(request,timeout=35).read()
          im=Image.open(io.BytesIO(data)).convert('RGB')
          assert min(im.size)>=350,im.size
          im.thumbnail((1100,1100),Image.Resampling.LANCZOS)
          p=Path('assets/products/snacks-private-label.webp')
          p.parent.mkdir(parents=True,exist_ok=True)
          im.save(p,'WEBP',quality=86)
          print('Image verified',im.size,p.stat().st_size)
          PY
      - name: Apply image to home, catalog and product pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          count=0
          for lang in ('pt','en','es','it'):
            for relative in ('index.html','commerce/index.html','commerce/food-consumer/index.html'):
              p=Path(lang)/relative
              s=p.read_text()
              prefix='../' if relative=='index.html' else '../../' if relative=='commerce/index.html' else '../../../'
              url=prefix+'assets/products/snacks-private-label.webp'
              if relative.endswith('food-consumer/index.html'):
                s,n=re.subn(r'(<div class="zb-sector-detail-top"><img src=")[^"]+',lambda m:m.group(1)+url,s,count=1)
              else:
                m=re.search(r'<a class="zb-premium-card" href="(?:commerce/)?food-consumer/">.*?</a>',s,re.S)
                assert m,p
                card=m.group()
                card,n=re.subn(r'(<img src=")[^"]+',lambda m:m.group(1)+url,card,count=1)
                card=re.sub(r' onerror="[^"]*"','',card)
                s=s[:m.start()]+card+s[m.end():]
              assert n==1,p
              p.write_text(s)
              count+=1
          print('Updated',count,'pages')
          PY
      - name: Verify image and references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('assets/products/snacks-private-label.webp')
          with Image.open(p) as im:assert im.width>=350 and im.height>=350
          for lang in ('pt','en','es','it'):
            for rel in ('index.html','commerce/index.html','commerce/food-consumer/index.html'):
              s=(Path(lang)/rel).read_text()
              assert 'snacks-private-label.webp' in s,(lang,rel)
          print('All 12 image references validated')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products/snacks-private-label.webp pt en es it
          git commit -m "Publish accurate packaged snacks and cookies image across four languages"
          git push
