name: Complete international services content
on:
  push:
    paths:
      - '.github/workflows/complete-services.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update five service pages and menus in four languages
        run: |
          cat > /tmp/services.py <<'PY'
          from pathlib import Path
          import re, html
          esc=html.escape
          content={
          'pt':{
            'headline':'Serviços internacionais','intro':'Conectamos fabricantes, importadores, distribuidores e compradores por meio de representação comercial, pesquisa, sourcing e desenvolvimento de negócios.','more':'Ver serviço','scope':'Escopo e condições definidos por projeto. Não executamos despacho aduaneiro, certificações, inspeções ou transporte como prestadores próprios. Essas atividades dependem de profissionais habilitados quando necessárias.','labelExample':'Exemplo de aplicação','labelActivities':'Como podemos apoiar','labelDetails':'O que precisamos saber','labelTerms':'Modelo comercial','cta':'Apresente sua oportunidade','ctaDesc':'Descreva seu produto, mercado, volume estimado e objetivo. Avaliaremos as possibilidades e os próximos passos.','contact':'Contato comercial','services':[
            ('b2b-representation','Representação comercial','Encontramos compradores para fabricantes','Conectamos fabricantes a distribuidores, importadores e clientes empresariais interessados em novos produtos e mercados.','Uma fabricante de embalagens busca distribuidores no Brasil. Pesquisamos potenciais compradores, organizamos apresentações e apoiamos as negociações.', ['Estudo do portfólio e dos mercados-alvo','Identificação de compradores e distribuidores potenciais','Apresentação comercial, organização de consultas e apoio às negociações','Acompanhamento de oportunidades e alinhamento entre as partes'],'Produtos, mercados de interesse, condições de venda, volumes pretendidos e responsabilidades comerciais.','Comissão sobre negócios efetivamente concluídos, quando previamente acordada em contrato.'),
            ('import-export','Importação e exportação','Conectamos negócios entre países','Apoiamos a estruturação comercial de compras e vendas internacionais, conectando fornecedores, compradores e prestadores especializados quando necessário.','Um distribuidor brasileiro deseja importar produtos do Paraguai. Pesquisamos alternativas, organizamos propostas e apoiamos a coordenação comercial com os responsáveis pela logística e pelo desembaraço.', ['Levantamento de produtos, fornecedores e compradores','Comparação de propostas e condições comerciais','Apoio na negociação de quantidades, prazos e Incoterms, quando aplicáveis','Articulação com despachantes, transportadores e especialistas contratados pelo cliente'],'Produto, classificação quando disponível, origem, destino, volume, requisitos e modelo de operação.','Honorários por projeto ou comissão comercial, conforme proposta e contrato.'),
            ('manufacturer-sourcing','Localização de fabricantes','Encontramos fornecedores para seu produto','Pesquisamos e comparamos fabricantes potenciais conforme especificações, capacidade declarada e condições comerciais, sem presumir homologação técnica.','Um comprador espanhol procura bandejas plásticas. Identificamos possíveis fabricantes no Paraguai, Brasil e outros mercados e levantamos informações para comparação.', ['Pesquisa de fabricantes por país e segmento','Solicitação e comparação de catálogos e propostas','Avaliação preliminar de capacidade, quantidades mínimas e prazos informados','Organização de amostras e verificações documentais com terceiros, se contratadas'],'Produto, desenho ou ficha técnica, material, quantidade, qualidade requerida, destino e prazo desejado.','Honorários definidos para a pesquisa ou projeto de sourcing.'),
            ('market-research','Pesquisa de mercado','Identificamos mercados e oportunidades','Analisamos oportunidades comerciais, concorrência, canais de distribuição e possíveis compradores com informações disponíveis e verificáveis.','Um fabricante avalia lançar snacks no Brasil ou nos Estados Unidos. Investigamos concorrentes, importadores potenciais, canais de venda e exigências a verificar.', ['Mapeamento de mercados, segmentos e canais','Pesquisa de concorrentes e referências de preços','Identificação de importadores e distribuidores potenciais','Relatório de oportunidades, barreiras e próximos passos'],'Países prioritários, linha de produtos, posicionamento de preço, público-alvo e objetivos de expansão.','Estudo comercial contratado, com escopo, entregáveis e prazo definidos.'),
            ('product-development','Desenvolvimento de produtos e Private Label','Desenvolvemos produtos e marcas próprias','Apoiamos a especificação de novos produtos e a busca de fabricantes para customização, embalagem e produção sob marca própria, sujeitas à viabilidade e acordo.','Um atacadista deseja comercializar biscoitos e salgadinhos com marca própria. Investigamos fabricantes, formatos de embalagem, pedidos mínimos e possibilidades de personalização.', ['Definição de requisitos técnicos e apresentação comercial','Pesquisa de fabricantes capazes de produzir ou personalizar','Levantamento de embalagens, opções de rotulagem e pedidos mínimos','Coordenação comercial de amostras, ajustes e propostas'],'Categoria, ingredientes ou materiais, embalagem desejada, marca, volume, país de venda e requisitos regulatórios.','Honorários de desenvolvimento ou comissão contratual, conforme o projeto.')
          ]},
          'en':{
            'headline':'International services','intro':'We connect manufacturers, importers, distributors and business buyers through commercial representation, sourcing, research and business development.','more':'Explore service','scope':'Scope and terms are agreed per project. Customs clearance, certification, inspections and freight transport are not presented as in-house services; qualified third parties may be required.','labelExample':'Practical example','labelActivities':'How we can assist','labelDetails':'Information we need','labelTerms':'Commercial arrangement','cta':'Discuss a business opportunity','ctaDesc':'Share your product, target market, estimated volume and business objective. We will assess potential next steps.','contact':'Business inquiry','services':[
            ('b2b-representation','Commercial representation','We find buyers for manufacturers','We connect manufacturers with distributors, importers and business customers exploring new products and markets.','A packaging manufacturer seeks distributors in Brazil. We identify potential buyers, organize presentations and support commercial negotiations.',['Review product portfolios and target markets','Identify potential buyers and distributors','Present offers and organize commercial inquiries','Track opportunities and coordinate discussions'],'Products, target markets, sales terms, expected volumes and responsibilities.','Commission on completed transactions if agreed in advance under contract.'),
            ('import-export','Import and export','We connect international business','We assist the commercial planning of cross-border sourcing and sales, working alongside specialized service providers as needed.','A Brazilian distributor wants products from Paraguay. We research suppliers, compare offers and coordinate commercially with logistics and customs professionals.',['Research products, suppliers and buyers','Compare quotations and commercial terms','Support negotiations on volumes, deadlines and applicable Incoterms','Coordinate with third-party customs and logistics specialists'],'Product, origin, destination, volume, requirements and intended transaction structure.','Project fees or an agreed commercial commission.'),
            ('manufacturer-sourcing','Manufacturer sourcing','We find suppliers for your product','We research and compare potential manufacturers according to product requirements, declared capacity and commercial terms; this is not a technical certification.','A Spanish buyer needs plastic food trays. We investigate manufacturers and compare available proposals.',['Identify manufacturers by market and segment','Request catalogs and compare quotations','Review stated minimum orders, capabilities and lead times','Coordinate samples and third-party document verification when contracted'],'Product specifications, technical drawings, required quality, quantity, destination and timeline.','Agreed sourcing or research project fee.'),
            ('market-research','Market research','We identify markets and opportunities','We analyze competition, distribution channels and prospective buyers using available and verifiable market information.','A food manufacturer considers selling snacks in Brazil or the US. We examine competitors, potential importers and distribution channels.',['Map target markets and sales channels','Research competitors and pricing references','Identify potential importers and distributors','Prepare opportunities, barriers and next-step findings'],'Target countries, products, price positioning, customers and expansion goals.','Contracted research study with defined scope and deliverables.'),
            ('product-development','Product development and Private Label','We develop products and private brands','We assist product specifications and the search for factories capable of customization, packaging and private-label production, subject to feasibility and agreement.','A wholesaler wants cookies and savory snacks under its own brand. We research factories, packaging options and minimum order quantities.',['Define product and packaging requirements','Find potential contract manufacturers','Assess packaging, labeling and order minimums','Support sample and proposal coordination'],'Product type, materials or ingredients, packaging, brand, estimated volume, sales country and regulatory needs.','Product-development fees or contractual commission.')
          ]},
          'es':{
            'headline':'Servicios internacionales','intro':'Conectamos fabricantes, importadores, distribuidores y compradores mediante representación comercial, sourcing, investigación y desarrollo de negocios.','more':'Ver servicio','scope':'El alcance se acuerda por proyecto. Despacho aduanero, certificaciones, inspecciones y transporte no se anuncian como servicios propios y pueden requerir especialistas habilitados.','labelExample':'Ejemplo práctico','labelActivities':'Cómo podemos ayudar','labelDetails':'Información necesaria','labelTerms':'Modelo comercial','cta':'Presente una oportunidad','ctaDesc':'Indique producto, mercado, volumen estimado y objetivo. Evaluaremos los siguientes pasos.','contact':'Contacto comercial','services':[
            ('b2b-representation','Representación comercial','Encontramos compradores para fabricantes','Conectamos fabricantes con importadores, distribuidores y clientes empresariales que buscan nuevos mercados.','Una fábrica de envases desea distribuidores en Brasil. Identificamos compradores potenciales y apoyamos la presentación comercial.',['Estudiar el portafolio y mercados objetivo','Identificar compradores y distribuidores','Organizar propuestas y negociaciones','Dar seguimiento a oportunidades'],'Productos, mercados, condiciones, volúmenes y responsabilidades.','Comisión por negocios concretados, si existe acuerdo contractual previo.'),
            ('import-export','Importación y exportación','Conectamos negocios entre países','Apoyamos la estructuración comercial de operaciones internacionales y la coordinación con prestadores especializados.','Un distribuidor brasileño busca productos paraguayos. Investigamos opciones, comparamos cotizaciones y coordinamos los contactos comerciales.',['Identificar productos, compradores y proveedores','Comparar propuestas y condiciones','Apoyar negociaciones e Incoterms aplicables','Coordinar con profesionales externos de aduanas y logística'],'Producto, origen, destino, volumen, requisitos y modalidad de operación.','Honorarios por proyecto o comisión comercial acordada.'),
            ('manufacturer-sourcing','Localización de fabricantes','Encontramos proveedores para su producto','Investigamos fabricantes potenciales y sus condiciones comerciales sin presumir homologación técnica.','Un comprador español necesita bandejas plásticas. Buscamos fabricantes y comparamos propuestas.',['Buscar fábricas por país y sector','Solicitar catálogos y ofertas','Comparar pedidos mínimos y plazos declarados','Coordinar muestras y validaciones externas cuando se contraten'],'Ficha técnica, material, cantidad, calidad, destino y plazo.','Tarifa de investigación o proyecto de sourcing.'),
            ('market-research','Investigación de mercado','Identificamos mercados y oportunidades','Analizamos competencia, canales de distribución y compradores potenciales con información verificable.','Una fábrica evalúa introducir snacks en Brasil o EE. UU. Analizamos canales, competencia y posibles importadores.',['Mapear mercados y canales','Investigar precios y competidores','Identificar importadores y distribuidores','Elaborar informe de oportunidades y barreras'],'Países prioritarios, productos, precios, clientes y objetivos.','Estudio comercial contratado con entregables definidos.'),
            ('product-development','Desarrollo de productos y Marca Propia','Desarrollamos productos y marcas propias','Apoyamos las especificaciones y la búsqueda de fabricantes de productos personalizados, envases y marcas propias, sujetos a negociación.','Un mayorista desea galletas y snacks con su propia marca. Buscamos fábricas, formatos de envase y pedidos mínimos.',['Definir producto y presentación','Buscar fabricantes capaces de personalizar','Comparar opciones de envase y cantidades mínimas','Coordinar muestras y propuestas'],'Producto, ingredientes o materiales, envase, marca, cantidad, país y normas aplicables.','Honorarios de desarrollo o comisión acordada.')
          ]},
          'it':{
            'headline':'Servizi internazionali','intro':'Colleghiamo produttori, importatori, distributori e acquirenti attraverso rappresentanza commerciale, sourcing, ricerca e sviluppo del business.','more':'Scopri il servizio','scope':'Ambito e condizioni sono definiti per progetto. Sdoganamento, certificazioni, ispezioni e trasporto non sono servizi interni dichiarati e possono richiedere professionisti qualificati.','labelExample':'Esempio pratico','labelActivities':'Come possiamo aiutare','labelDetails':'Dati necessari','labelTerms':'Modello commerciale','cta':'Presenta una opportunità','ctaDesc':'Descrivi prodotto, mercato, volume stimato e obiettivo. Valuteremo i passi successivi.','contact':'Contatto commerciale','services':[
            ('b2b-representation','Rappresentanza commerciale','Troviamo clienti per i produttori','Mettiamo in contatto produttori, importatori e distributori per sviluppare nuovi mercati.','Un produttore di imballaggi cerca distributori in Brasile. Individuiamo possibili acquirenti e supportiamo i contatti commerciali.',['Esaminare cataloghi e mercati obiettivo','Identificare clienti e distributori','Organizzare proposte e trattative','Monitorare le opportunità'],'Prodotti, mercati, condizioni, volumi e responsabilità.','Commissione su operazioni concluse, previo accordo contrattuale.'),
            ('import-export','Importazione ed esportazione','Colleghiamo aziende tra paesi','Supportiamo la pianificazione commerciale di acquisti e vendite internazionali con specialisti esterni quando necessari.','Un distributore cerca prodotti dal Paraguay. Studiamo fornitori, preventivi e condizioni commerciali.',['Ricercare prodotti, fornitori e clienti','Confrontare offerte e condizioni','Supportare le trattative e Incoterms applicabili','Coordinarsi con specialisti esterni di dogana e logistica'],'Prodotto, origine, destinazione, volume, requisiti e struttura dell’operazione.','Compenso per progetto o commissione concordata.'),
            ('manufacturer-sourcing','Ricerca di produttori','Troviamo fornitori per i tuoi prodotti','Ricerchiamo produttori potenziali e confrontiamo capacità dichiarate e condizioni, senza attestare certificazioni tecniche.','Un cliente spagnolo cerca vassoi alimentari. Individuiamo produttori e confrontiamo proposte.',['Ricercare fabbriche per settore e paese','Richiedere cataloghi e offerte','Confrontare minimi e tempi dichiarati','Coordinare campioni e verifiche esterne se richieste'],'Specifiche prodotto, materiale, quantità, qualità, destinazione e scadenza.','Compenso di sourcing o ricerca concordato.'),
            ('market-research','Ricerca di mercato','Identifichiamo mercati e opportunità','Analizziamo concorrenza, canali distributivi e potenziali acquirenti attraverso fonti verificabili.','Un produttore vuole vendere snack in Brasile o USA. Esaminiamo concorrenti, importatori e canali.',['Mappare mercati e canali','Studiare concorrenza e prezzi','Identificare importatori e distributori','Preparare un rapporto su opportunità e ostacoli'],'Paesi prioritari, prodotti, posizionamento e obiettivi.','Studio commerciale con ambito e risultati concordati.'),
            ('product-development','Sviluppo prodotti e Private Label','Sviluppiamo prodotti e marchi propri','Supportiamo la definizione di prodotti, imballaggi e ricerca di fabbriche per private label, previa verifica di fattibilità.','Un grossista vuole biscotti e snack a marchio proprio. Ricerchiamo produttori, packaging e quantità minime.',['Definire prodotto e confezione','Ricercare produttori personalizzati','Valutare imballaggi e minimi d’ordine','Coordinare campioni e offerte'],'Prodotto, ingredienti o materiali, imballaggio, marchio, quantità, paese e requisiti normativi.','Compenso per sviluppo o commissione contrattuale.')
          ]}
          }
          count=0
          for lang,t in content.items():
            root=Path(lang)/'services'
            overview=root/'index.html'
            html_overview=overview.read_text()
            cards=''.join(
              '<article class="zb-service-overview-card"><span class="zb-service-num">0'+str(i+1)+'</span><h2>'+esc(row[1])+'</h2><p class="zb-service-summary">'+esc(row[2])+'</p><p>'+esc(row[3])+'</p><a href="'+row[0]+'/">'+esc(t['more'])+' →</a></article>'
              for i,row in enumerate(t['services'])
            )
            body='<main class="zb-inner-page"><section class="subhero zb-inner-hero"><div class="wrap"><div class="eyebrow">ZABIELOS / INTERNATIONAL BUSINESS</div><h1>'+esc(t['headline'])+'</h1><p>'+esc(t['intro'])+'</p></div></section><section class="section"><div class="wrap"><div class="zb-services-overview-grid">'+cards+'</div><p class="note zb-service-scope">'+esc(t['scope'])+'</p></div></section></main>'
            a=html_overview.find('<main');b=html_overview.find('</main>',a)
            assert a>=0 and b>a,overview
            html_overview=html_overview[:a]+body+html_overview[b+7:]
            overview.write_text(html_overview)
            count+=1
            for row in t['services']:
              slug,title,short,desc,example,actions,needed,terms=row
              path=root/slug/'index.html'
              s=path.read_text()
              action_html=''.join('<li>'+esc(x)+'</li>' for x in actions)
              main=(
                '<main class="zb-inner-page"><section class="subhero zb-inner-hero"><div class="wrap"><div class="eyebrow">ZABIELOS / INTERNATIONAL SERVICES</div><h1>'+esc(title)+'</h1><p>'+esc(short)+'</p></div></section>'
                '<section class="section"><div class="wrap"><div class="zb-service-detail-intro"><div><h2>'+esc(title)+'</h2><p class="lead">'+esc(desc)+'</p></div><div class="zb-service-example"><span>'+esc(t['labelExample'])+'</span><p>'+esc(example)+'</p></div></div>'
                '<div class="zb-service-detail-grid"><section><h2>'+esc(t['labelActivities'])+'</h2><ul>'+action_html+'</ul></section><section><h2>'+esc(t['labelDetails'])+'</h2><p>'+esc(needed)+'</p><h3>'+esc(t['labelTerms'])+'</h3><p>'+esc(terms)+'</p></section></div>'
                '<p class="note zb-service-scope">'+esc(t['scope'])+'</p>'
                '<div class="zb-service-detail-cta"><div><h2>'+esc(t['cta'])+'</h2><p>'+esc(t['ctaDesc'])+'</p></div><a class="btn" href="../../contact/">'+esc(t['contact'])+' →</a></div>'
                '</div></section></main>'
              )
              a=s.find('<main');b=s.find('</main>',a)
              assert a>=0 and b>a,path
              s=s[:a]+main+s[b+7:]
              s=re.sub(r'<title>.*?</title>',lambda _: '<title>'+esc(title)+' | ZABIELOS</title>',s,count=1)
              path.write_text(s)
              count+=1
            # Upgrade the dropdown in each page while keeping link destinations intact.
            menu_map={row[0]:row[2] for row in t['services']}
            for file in Path(lang).rglob('index.html'):
              s=file.read_text()
              start=s.find('<div class="zb-dropdown" id="zb-menu-services">')
              if start<0:raise RuntimeError('Service dropdown absent from '+str(file))
              end=s.find('</div>',start)
              if end<0:raise RuntimeError(str(file))
              menu=s[start:end+6]
              for slug,subtitle in menu_map.items():
                pattern=r'(<a href="[^"]*/services/'+re.escape(slug)+r'/">)(.*?)(</a>)'
                menu,n=re.subn(pattern,lambda m:m.group(1)+'<span class="zb-menu-title">'+m.group(2)+'</span><small>'+esc(subtitle)+'</small>'+m.group(3),menu,count=1)
                if n!=1:raise RuntimeError('Missing menu item '+slug+' in '+str(file))
              s=s[:start]+menu+s[end+6:]
              file.write_text(s)
            home=Path(lang)/'index.html'
            h=home.read_text()
            for slug,subtitle in menu_map.items():
              pattern=r'(<a href="services/'+re.escape(slug)+r'/" class="zb-premium-service">.*?<strong>.*?</strong>)(<small>).*?(</small>)'
              h=re.sub(pattern,lambda m:m.group(1)+m.group(2)+esc(subtitle)+m.group(3),h,count=1,flags=re.S)
            home.write_text(h)
          css=Path('assets/zabielos-clean.css')
          css.write_text(css.read_text()+"""
          /* International services: complete descriptions and credible B2B positioning */
          .nav .zb-dropdown>a small{display:block;font-size:11px;font-weight:450;color:#647986;line-height:1.35;margin-top:2px}
          .nav .zb-dropdown>a .zb-menu-title{display:block;font-size:14px;font-weight:700;line-height:1.25}
          .zb-services-overview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}
          .zb-service-overview-card{border:1px solid #dfe8ed;border-radius:15px;padding:26px;background:white;box-shadow:0 8px 26px #08263d0e;display:flex;flex-direction:column}
          .zb-service-overview-card .zb-service-num{color:#529d22;font-size:12px;font-weight:800}
          .zb-service-overview-card h2{font-size:23px;line-height:1.22;margin:12px 0}
          .zb-service-overview-card p{font-size:14px;color:#566d7b;margin:0 0 13px}
          .zb-service-overview-card .zb-service-summary{font-weight:750;color:#1d4c34}
          .zb-service-overview-card a{margin-top:auto;color:#2d7725;font-weight:800}
          .zb-service-scope{margin-top:24px;max-width:1100px}
          .zb-service-detail-intro{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}
          .zb-service-detail-intro h2{margin:0 0 14px}
          .zb-service-detail-intro .lead{line-height:1.65}
          .zb-service-example{padding:26px;background:#f0f7f4;border-left:5px solid #a3eb19;border-radius:12px}
          .zb-service-example span{font-size:12px;color:#2e7726;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
          .zb-service-example p{color:#3e5d6b;margin:11px 0 0;line-height:1.6}
          .zb-service-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}
          .zb-service-detail-grid section{background:#f7f9fa;border:1px solid #e0e8eb;border-radius:13px;padding:25px}
          .zb-service-detail-grid h2{font-size:24px;margin:0 0 13px}
          .zb-service-detail-grid h3{font-size:17px;margin:20px 0 8px}
          .zb-service-detail-grid p{color:#566c78}
          .zb-service-detail-grid ul{padding-left:21px;line-height:1.9}
          .zb-service-detail-grid li::marker{color:#4a9726}
          .zb-service-detail-cta{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-top:26px;border-radius:14px;background:#082d44;color:white;padding:25px 28px}
          .zb-service-detail-cta h2{font-size:25px;margin:0}
          .zb-service-detail-cta p{color:#d5e4ea;margin:8px 0 0}
          .zb-service-detail-cta .btn{white-space:nowrap}
          @media(max-width:980px){.zb-services-overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:700px){.zb-services-overview-grid,.zb-service-detail-intro,.zb-service-detail-grid{grid-template-columns:1fr}.zb-service-detail-cta{flex-direction:column;align-items:stretch}.zb-service-detail-cta .btn{text-align:center}.zb-service-overview-card{padding:22px}}
          """)
          print('Updated',count,'service pages and all multilingual menus')
          PY
      - name: Validate every page and service dropdown
        run: |
          python3 - <<'PY'
          from pathlib import Path
          slugs=('b2b-representation','import-export','manufacturer-sourcing','market-research','product-development')
          for lang in ('pt','en','es','it'):
            for slug in slugs:
              p=Path(lang)/'services'/slug/'index.html'
              html=p.read_text()
              assert 'zb-service-detail-intro' in html and 'zb-service-detail-grid' in html,(p,html[html.find('<main'):html.find('<main')+700])
              assert 'zb-service-detail-cta' in html,p
            overview=(Path(lang)/'services/index.html').read_text()
            assert overview.count('class="zb-service-overview-card"')==5,lang
            pages=list(Path(lang).rglob('index.html'))
            for p in pages:
              html=p.read_text()
              assert html.count('class="zb-menu-title"')==5,p
              for slug in slugs:assert '/services/'+slug+'/' in html,(p,slug)
          print('Verified 20 service detail pages, 4 overviews and 4-language navigation')
          PY
      - name: Commit multilingual commercial services
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt en es it assets/zabielos-clean.css
          git commit -m "Explain five international B2B services with examples scope and commercial models"
          git push
