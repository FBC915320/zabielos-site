name: Prepare unbranded Shade Sail lifestyle crop
on:
  push:
    paths: ['.github/workflows/replace-sail.yml']
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pillow
      - name: Crop product application photo without packaging and logo
        run: |
          python3 - <<'PY'
          from PIL import Image
          p='assets/products/shade-sail.webp'
          im=Image.open(p).convert('RGB')
          w,h=im.size
          im=im.crop((int(w*.50),int(h*.235),int(w*.81),int(h*.52)))
          im=im.resize((1000,900),Image.Resampling.LANCZOS)
          im.save(p,'WEBP',quality=88,method=6)
          print('Cropped clean product scene',im.size)
          PY
      - name: Commit corrected product image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products/shade-sail.webp
          git commit -m "Use clean Shade Sail application photo without packaging or CIKALA logo"
          git push
