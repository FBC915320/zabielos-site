name: Prepare official product photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/product-photos.yml'
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image optimizer
        run: python3 -m pip install --user pillow
      - name: Download and optimize official public product photos
        run: |
          python3 - <<'PY'
          import urllib.request, re, html, os, io
          from urllib.parse import urlparse
          from PIL import Image,ImageOps
          sources = {
            'shade':'https://www.cikala.com.br/tela-sombreamento-azul-para-cobertura-e-decorativa-kit-de-instalac-o/',
            'shade-sail':'https://www.cikala.com.br/cobertura-areia-em-tecido-resistente-a-agua-com-argolas-pronta-para-fixac-o-shade-sail',
            'tarpaulins':'https://www.cikala.com.br/lona-em-polietileno-ck300-micras-azul-1x2-06-m-protec-o-e-forrac-o-por-metro-para-construc-o-civil'
          }
          os.makedirs('assets/products',exist_ok=True)
          for key,page in sources.items():
            try:
              req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'})
              body=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','ignore')
              print('DEBUG',key,'html_size',len(body),'jpgs',re.findall(r'https?://[^\\s\\\"<>]+?\\.(?:jpg|png|webp)',body,re.I)[:6])
              meta=re.findall(r'<meta\s+[^>]*>',body,re.I)
              print('META',key,[x[:250] for x in meta if 'image' in x.lower()][:8])
              urls=[]
              for tag in meta:
                if ('itemprop="image"' in tag or 'og:image' in tag or 'twitter:image' in tag):
                  m=re.search(r'content=["\']([^"\']+)["\']',tag,re.I)
                  if m:urls.append(html.unescape(m.group(1)))
              for src in urls:
                if src.startswith('//'):src='https:'+src
                if not src.startswith('https://'):continue
                if not (urlparse(src).hostname or ''):continue
                data=urllib.request.urlopen(urllib.request.Request(src,headers={'User-Agent':'Mozilla/5.0'}),timeout=25).read()
                im=Image.open(io.BytesIO(data)).convert('RGB')
                if min(im.size)<250:continue
                im.thumbnail((1600,1100),Image.Resampling.LANCZOS)
                im.save('assets/products/'+key+'.webp','WEBP',quality=83,method=6)
                print(key,src,im.size)
                break
              else:raise RuntimeError('No suitable official image metadata')
            except Exception as e:
              print('Photo unavailable:',key,str(e))
          PY
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products/
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized public CIKALA product photography for Zabielos"
            git push
          fi
